<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="努力賺錢錢">
<meta name="theme-color" content="#f5f8fc" id="theme-color-meta">
<link rel="apple-touch-icon" href="icon.png">
<title>努力賺錢錢 (Cloud Sync)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<!-- 引入 Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
--bg-color: #f5f8fc;
--card-bg: #ffffff;
--primary: #6d90c4;
--primary-dark: #3f5f8f;
--primary-hover: #3f5f8f;
--primary-light: #eaf1fb;
--text-main: #212529;
--text-sub: #6c757d;
--border-color: #f5f8fa;
--accent-price: #2e7d32;
--plan-bg: #eaf1fb;
--plan-border: #90b8e0;
--danger: #e53935;
--holiday-red: #e53935;
--nav-height: 50px;
--safe-bottom: env(safe-area-inset-bottom, 0px);
--safe-top: env(safe-area-inset-top, 0px);
--input-bg: #fdfdfc;
}

body.dark-mode {
--bg-color: #121824;
--card-bg: #1e2638;
--primary: #8fb1e0;
--primary-dark: #8fb1e0;
--primary-hover: #a3c2ee;
--primary-light: #2a364f;
--text-main: #f0f4f9;
--text-sub: #9ca3af;
--border-color: #2a3447;
--accent-price: #81c784;
--plan-bg: #2a364f;
--plan-border: #4a5d7e;
--danger: #ef5350;
--holiday-red: #ef5350;
--input-bg: #2a364f;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
background-color: var(--bg-color);
padding: calc(4px + var(--safe-top)) 10px calc(var(--nav-height) + var(--safe-bottom) + 42px) 10px;
display: flex; justify-content: center; align-items: flex-start; min-height: 100dvh;
transition: background-color 0.3s, color 0.3s;
}
.container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 13px; min-height: calc(100dvh - var(--nav-height) - var(--safe-bottom) - var(--safe-top) - 24px); }
.top-header { display: flex; justify-content: space-between; align-items: center; padding: 2px 5px; position: relative; }
.top-header h1 { color: var(--primary-dark); font-size: 1.35rem; font-weight: 800; text-align: center; width: 100%; }
.theme-toggle-btn { position: absolute; right: 5px; background: var(--primary-light); border: none; color: var(--text-main); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }
.sync-status-bar { font-size: 0.72rem; text-align: center; color: var(--text-sub); margin-top: -8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #ccc; display: inline-block; }
.sync-dot.online { background-color: #4caf50; }
.sync-dot.syncing { background-color: #ff9800; }

.card { background-color: var(--card-bg); border-radius: 20px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); overflow: hidden; transition: background-color 0.3s; }
.cardTitle { padding: 18px; }
.month-salary-card { background: linear-gradient(135deg, #4a6fa5, #2c4366); border-radius: 18px; padding: 18px 20px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15); }
.salary-box { display: flex; flex-direction: column; }
.salary-box span { font-size: 0.76rem; color: rgba(255, 255, 255, 0.85); font-weight: 600; }
.salary-box strong { font-size: 1.35rem; color: #ffffff; font-weight: 800; margin-top: 2px; }
.salary-divider { width: 1px; height: 35px; background-color: rgba(255, 255, 255, 0.25); }

.calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.calendar-header h2 { font-size: 1.1rem; color: var(--primary-dark); font-weight: 800; }
.month-nav { display: flex; gap: 8px; }
.btn-nav { background-color: var(--primary-light); color: var(--primary-dark); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; cursor: pointer; font-weight: 700; }
.calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 700; color: var(--text-main); padding-bottom: 8px; font-size: 0.78rem; border-bottom: 1px solid var(--border-color); }
.calendar-weekdays .sun-label { color: var(--holiday-red); font-weight: 800; }
.calendar-days { user-select: none; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(88px, auto); }
.day-cell { min-height: 88px; max-height: 132px; padding: 3px 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
.day-cell.other-month { opacity: 0.3; background-color: transparent; }
.day-number { color: var(--text-main); font-weight: 700; font-size: 0.72rem; margin-bottom: 3px; }
.day-cell.today { background-color: var(--primary-light); }
.day-cell.today .day-number { color: var(--primary-dark); }
.day-cell.is-holiday .day-number { color: var(--holiday-red); }
.holiday-label { font-size: 0.5rem; color: var(--holiday-red); font-weight: 700; text-align: center; }

.shift-items-wrap { width: 100%; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; flex: 1; min-height: 0; }
.shift-dot-item { background-color: #3f5f8f; padding: 1px 0; width: 100%; text-align: center; cursor: pointer; font-size: 0.56rem; font-weight: 700; }
body.dark-mode .shift-dot-item { background-color: #2c4366; }
.shift-dot-item .comp-name, .shift-dot-item .shift-time { color: #ffffff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.6rem; }
.shift-dot-item .shift-money { font-weight: 800; font-size: 0.55rem; color: #ffffff; }

#calendar-view, #list-view, #analytics-view { margin-bottom: calc(var(--nav-height) + var(--safe-bottom) + 42px); }
.list-filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
.filter-btn { background-color: var(--primary-light); border: 1.5px solid transparent; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; color: var(--text-sub); cursor: pointer; white-space: nowrap; }
.filter-btn.active { background-color: var(--primary); color: white; }
.shift-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
.shift-info h4 { font-size: 0.95rem; color: var(--text-main); }
.shift-info p { font-size: 0.78rem; color: var(--text-sub); }
.shift-amount { text-align: right; }
.shift-amount .price { font-size: 1rem; font-weight: 800; color: var(--accent-price); }
.shift-amount .hrs { font-size: 0.75rem; color: var(--text-sub); }

.analytics-summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
.stat-box { background: var(--primary-light); border-radius: 14px; padding: 12px 8px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
.stat-box span { font-size: 0.68rem; color: var(--primary-dark); font-weight: 700; }
.stat-box strong { font-size: 1.05rem; color: var(--text-main); font-weight: 800; }
.analytics-section-title { font-size: 0.88rem; font-weight: 800; color: var(--primary-dark); margin: 16px 0 8px 0; }
.company-stat-item { padding: 12px; border-bottom: 1px solid var(--border-color); background: var(--primary-light); border-radius: 12px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; column-gap: 12px; }
.company-stat-name { font-size: 0.88rem; font-weight: 800; color: var(--text-main); }
.company-stat-pay { font-size: 1.1rem; font-weight: 800; color: var(--accent-price); text-align: right; }
.company-stat-meta { font-size: 0.74rem; color: var(--text-sub); }

.fixed-bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-height) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background-color: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 999; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; border: none; color: var(--text-sub); font-size: 0.62rem; font-weight: 700; cursor: pointer; height: 100%; }
.nav-item svg { width: 25px; height: 25px; fill: currentColor; }
.nav-item.active { color: var(--primary-dark); }
.nav-item-add-container { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; max-width: 70px; }
.btn-add-highlight { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #4a6fa5, #2c4366); color: white; border: 4px solid var(--card-bg); display: flex; justify-content: center; align-items: center; font-size: 1.7rem; cursor: pointer; }

.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
.modal-overlay.active { display: flex; }
.modal-content { background-color: var(--card-bg); color: var(--text-main); width: 100%; max-width: 480px; border-radius: 20px; padding: 22px; max-height: calc(100vh - 30px); overflow-y: auto; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; position: relative; }
.modal-header h2 { font-size: 1.2rem; color: var(--primary-dark); font-weight: 800; text-align: center; width: 100%; }
.close-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-sub); position: absolute; right: 0; }
.date-tag-badge { display: block; background: var(--primary-light); color: var(--primary-dark); font-weight: 700; font-size: 0.98rem; padding: 9px 14px; border-radius: 10px; text-align:center; }
.company-input-wrapper { position: relative; }
.company-input-wrapper input { width: 100%; padding-right: 34px; }
.date-picker-trigger { display: flex; align-items: center; justify-content: space-between; background: var(--primary-light); color: var(--primary-dark); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 12px; font-size: 0.85rem; font-weight: 800; cursor: pointer; margin-bottom: 8px; }
.date-range-box { background: var(--primary-light); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 12px; }
.mini-cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.mini-cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.68rem; font-weight: 700; color: var(--text-sub); }
.mini-cal-days { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
.mini-cal-cell { height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
.mini-cal-cell.other-month { visibility: hidden; }
.mini-cal-num { width: 27px; height: 27px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.76rem; font-weight: 700; color: var(--text-main); }
.mini-cal-cell.range-start .mini-cal-num, .mini-cal-cell.range-end .mini-cal-num { background: var(--primary-dark); color: #fff; }

.form-grid { display: flex; flex-direction: column; gap: 12px; }
.input-group { display: flex; flex-direction: column; gap: 4px; }
.input-group label { font-size: 0.82rem; font-weight: 700; color: var(--primary-dark); }
.input-group input, .input-group select { padding: 9px 12px; border: 1.5px solid var(--border-color); border-radius: 10px; font-size: 0.9rem; background-color: var(--input-bg); color: var(--text-main); }
.time-range-group { display: flex; gap: 8px; align-items: center; }
.time-range-group select { flex: 1; }
.checkbox-group { display: flex; align-items: center; gap: 6px; }
.deduct-input-wrapper { display: none; margin-top: 4px; padding: 8px 10px; background-color: var(--primary-light); border-radius: 8px; }
.deduct-input-wrapper.active { display: flex; align-items: center; gap: 8px; }
.calculated-duration { font-size: 0.82rem; color: var(--primary-dark); font-weight: 800; }
.modal-btn-group { display: flex; gap: 10px; margin-top: 8px; }
.btn-submit { flex: 1; background-color: var(--primary-dark); color: #ffffff; border: none; padding: 12px; border-radius: 12px; font-size: 0.95rem; font-weight: 800; cursor: pointer; }
.btn-delete-item { background-color: rgba(229, 57, 53, 0.15); color: var(--danger); border: 1px solid var(--danger); padding: 12px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; }

.action-menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: flex-end; z-index: 1001; }
.action-menu-overlay.active { display: flex; }
.action-sheet { background: var(--card-bg); width: 100%; max-width: 600px; border-radius: 20px 20px 0 0; padding: 20px; padding-bottom: calc(20px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 10px; }
.action-sheet-title { text-align: center; font-weight: 800; color: var(--primary-dark); font-size: 0.95rem; }
.action-sheet-btn { padding: 12px; border: 1px solid var(--border-color); background: var(--primary-light); color: var(--text-main); border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-align: center; }
.action-sheet-btn.primary { background: var(--primary-dark); color: #ffffff; }
.action-sheet-btn.danger { background: rgba(229, 57, 53, 0.15); color: var(--danger); border-color: var(--danger); }
.empty-msg { text-align: center; padding: 30px; color: var(--text-sub); font-size: 0.88rem; }
</style>
</head>
<body>
<div class="container">
<div class="top-header">
<h1>🔥打工狗請努力🔥</h1>
<button class="theme-toggle-btn" id="theme-toggle" onclick="toggleDarkMode()">🌙</button>
</div>
<div class="sync-status-bar">
  <span class="sync-dot" id="sync-dot"></span>
  <span id="sync-text">雲端狀態：載入中...</span>
  <a href="#" onclick="promptChangeSyncKey(); return false;" style="color:var(--primary); text-decoration:underline; margin-left:6px;">Key 設定</a>
</div>

<div class="month-salary-card">
<div class="salary-box">
<span>血汗已換取</span>
<strong id="month-pay">$ 0</strong>
</div>
<div class="salary-divider"></div>
<div class="salary-box">
<span style="text-align:right;">本月努力指數</span>
<strong id="month-total-est" style="text-align:right;">$ 0</strong>
</div>
</div>

<!-- VIEW 1: Calendar View -->
<div id="calendar-view" class="card">
<div class="calendar-header cardTitle">
<h2 id="calendar-month-year"></h2>
<div class="month-nav">
<button class="btn-nav" onclick="changeMonth(-1)">&lt;</button>
<button class="btn-nav" onclick="changeMonth(1)">&gt;</button>
</div>
</div>
<div class="calendar-weekdays">
<div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div class="sun-label">日</div>
</div>
<div class="calendar-days" id="calendar-days"></div>
</div>

<!-- VIEW 2: List View -->
<div id="list-view" class="card" style="display: none;">
<div class="list-filter-bar cardTitle" id="company-filter-tabs"></div>
<div id="shift-list-container"></div>
</div>

<!-- VIEW 3: Analytics View -->
<div id="analytics-view" class="card cardTitle" style="display: none;">
<div class="calendar-header">
<h2 id="analytics-month-year"></h2>
<div class="month-nav">
<button class="btn-nav" id="prev-month-a">&lt;</button>
<button class="btn-nav" id="next-month-a">&gt;</button>
</div>
</div>
<div class="analytics-summary-grid">
<div class="stat-box"><span>本月做狗總時數</span><strong id="stat-hours">0h</strong></div>
<div class="stat-box"><span>本月已賺取</span><strong id="stat-total-pay">$0</strong></div>
</div>
<div class="analytics-section-title">🏢 追糧報表</div>
<div id="company-breakdown-container"></div>
<div class="analytics-section-title" style="margin-top: 20px;">📊 累積血汗指數</div>
<div class="analytics-summary-grid">
<div class="stat-box"><span>累積血汗</span><strong id="stat-all-hours">0h</strong></div>
<div class="stat-box"><span>累積錢錢</span><strong id="stat-all-pay">$0</strong></div>
</div>
</div>
</div>

<!-- FIXED BOTTOM MENU BAR -->
<nav class="fixed-bottom-nav">
<button class="nav-item active" id="nav-calendar" onclick="switchNav('calendar-view')">
<svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
</button>
<button class="nav-item" id="nav-list" onclick="switchNav('list-view')">
<svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
</button>
<div class="nav-item-add-container">
<button class="btn-add-highlight" onclick="openModal()">+</button>
</div>
<button class="nav-item" id="nav-analytics" onclick="switchNav('analytics-view')">
<svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg>
</button>
<button class="nav-item" id="nav-backup" onclick="openActionMenu()">
<svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
</button>
</nav>

<!-- Action Sheet -->
<div class="action-menu-overlay" id="action-menu-overlay" onclick="closeActionMenu()">
<div class="action-sheet" onclick="event.stopPropagation()">
<div class="action-sheet-title">備份與數據管理</div>
<button class="action-sheet-btn primary" onclick="exportJSON(); closeActionMenu();">匯出 JSON 備份檔</button>
<button class="action-sheet-btn" onclick="importJSON(); closeActionMenu();">匯入 JSON 備份</button>
<button class="action-sheet-btn danger" onclick="confirmClearAll(); closeActionMenu();">清空此 Sync Key 的雲端紀錄</button>
<button class="action-sheet-btn" onclick="closeActionMenu()">取消</button>
<input type="file" id="import-file" accept=".json" style="display:none;" onchange="handleFileSelect(event)">
</div>
</div>

<!-- Modal Form -->
<div class="modal-overlay" id="modal-overlay">
<div class="modal-content">
<div class="modal-header">
<h2 id="modal-title">有工番啦🤑</h2>
<button class="close-btn" onclick="closeModal()">✕</button>
</div>
<form id="shift-form" class="form-grid">
<input type="hidden" id="editing-shift-id" value="">
<input type="hidden" id="shift-type" value="planned">
<div class="input-group" id="date-range-container">
<div class="date-picker-trigger" id="date-picker-trigger" onclick="toggleDatePicker()">📅 <span id="date-picker-label">已選 1 天</span></div>
<div class="date-range-box" id="date-range-box" style="display:none;">
<div class="mini-cal-header">
<button type="button" class="btn-nav" id="mini-cal-prev">&lt;</button>
<span id="mini-cal-month-year"></span>
<button type="button" class="btn-nav" id="mini-cal-next">&gt;</button>
</div>
<div class="mini-cal-weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div style="color:var(--holiday-red);">日</div></div>
<div class="mini-cal-days" id="mini-cal-days"></div>
<div class="date-summary-text" id="date-summary-text" style="font-size:0.78rem; font-weight:700; color:var(--primary-dark); margin-top:6px;">已選 1 天</div>
</div>
<div class="date-tag-badge" id="date-tag-badge" style="display:none;"></div>
</div>
<div class="input-group">
<label for="company">公司名稱</label>
<div class="company-input-wrapper">
<input type="text" id="company" list="company-list" required autocomplete="off">
<datalist id="company-list"></datalist>
</div>
</div>
<div class="input-group"><label for="event-name">Event</label><input type="text" id="event-name"></div>
<div class="input-group"><label for="rate">💰 錢錢 ($/hr)</label><input type="number" id="rate" min="0" required></div>
<div class="input-group"><label for="allowance">🎁 津貼 ($)</label><input type="number" id="allowance" min="0" step="1" placeholder="0"></div>
<div class="input-group">
<label>工作時間 (開始 - 結束)</label>
<div class="time-range-group">
<select id="start-time" required onchange="calcDuration()"></select>
<span>至</span>
<select id="end-time" required onchange="calcDuration()"></select>
</div>
</div>
<div class="checkbox-group">
<input type="checkbox" id="no-lunch-check" onchange="toggleDeductInput()">
<label for="no-lunch-check" style="font-size:0.85rem; font-weight:600;">扣飯鐘</label>
</div>
<div class="deduct-input-wrapper" id="deduct-wrapper">
<label style="font-size:0.8rem;">扣除時間：</label>

// 初始化 Sync Key
async function initSyncKey() {
  if (!syncKey) {
    const defaultKey = 'dog-' + Math.floor(100000 + Math.random() * 900000);
    const input = prompt('請輸入你的「跨裝置同步 Sync Key」\n（手機與電腦輸入同一個 Key 就能同步數據）：', defaultKey);
    syncKey = (input && input.trim()) ? input.trim() : defaultKey;
    localStorage.setItem('user_sync_key', syncKey);
  }
  updateSyncStatus('online', `Sync Key: ${syncKey}`);
  await loadShiftsFromCloud();
}

function promptChangeSyncKey() {
  const newKey = prompt('修改你的 Sync Key (手機與電腦輸入相同 Key 即刻同步)：', syncKey);
  if (newKey && newKey.trim() && newKey.trim() !== syncKey) {
    syncKey = newKey.trim();
    localStorage.setItem('user_sync_key', syncKey);
    updateSyncStatus('online', `Sync Key: ${syncKey}`);
    loadShiftsFromCloud();
  }
}

function updateSyncStatus(status, text) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  dot.className = 'sync-dot ' + status;
  txt.textContent = text;
}

// 雲端資料庫操作 (Supabase CRUD)
async function loadShiftsFromCloud() {
  updateSyncStatus('syncing', '正在同步雲端數據...');
  try {
    const { data, error } = await db.from('shifts').select('*').eq('sync_key', syncKey);
    if (error) throw error;
    
    // 轉譯欄位格式
    shifts = (data || []).map(item => ({
      id: Number(item.id),
      date: item.date,
      company: item.company,
      eventName: item.event_name,
      rate: Number(item.rate),
      allowance: Number(item.allowance),
      startTime: item.start_time,
      endTime: item.end_time,
      deductMins: Number(item.deduct_mins),
      duration: Number(item.duration),
      type: item.type
    }));
    
    autoUpdatePastPlannedShifts();
    renderCurrentView();
    updateSyncStatus('online', `已同步 (${syncKey})`);
  } catch (err) {
    console.error(err);
    updateSyncStatus('', '同步失敗 (請檢查網絡)');
  }
}

async function saveShiftToCloud(shiftObj) {
  updateSyncStatus('syncing', '正在儲存到雲端...');
  const payload = {
    id: shiftObj.id,
    sync_key: syncKey,
    date: shiftObj.date,
    company: shiftObj.company,
    event_name: shiftObj.eventName,
    rate: shiftObj.rate,
    allowance: shiftObj.allowance,
    start_time: shiftObj.startTime,
    end_time: shiftObj.endTime,
    deduct_mins: shiftObj.deductMins,
    duration: shiftObj.duration,
    type: shiftObj.type
  };
  const { error } = await db.from('shifts').upsert(payload);
  if (error) console.error(error);
  updateSyncStatus('online', `已同步 (${syncKey})`);
}

async function deleteShiftFromCloud(id) {
  updateSyncStatus('syncing', '正在刪除...');
  await db.from('shifts').delete().eq('id', id).eq('sync_key', syncKey);
  updateSyncStatus('online', `已同步 (${syncKey})`);
}

// --- Night Mode ---
function initDarkMode() {
  const isDark = localStorage.getItem('nightMode') === 'true';
  if (isDark) {
    document.body.classList.add('dark-mode');
    document.getElementById('theme-toggle').textContent = '☀️';
  }
}

  localStorage.setItem('nightMode', isDark);
  document.getElementById('theme-toggle').textContent = isDark ? '☀️' : '🌙';
}

function getHolidayInfo(dateStr, dateObj) {
  const isSun = dateObj.getDay() === 0;
  const holidayName = hkHolidays[dateStr];
  if (holidayName) return { isHoliday: true, label: holidayName };
  if (isSun) return { isHoliday: true, label: '' };
  return { isHoliday: false, label: '' };
}

const modalOverlay = document.getElementById('modal-overlay');
const shiftForm = document.getElementById('shift-form');

function formatShortTime(timeStr) {
  if (!timeStr) return '';
  const [h, m] = timeStr.split(':');
  const hourNum = parseInt(h, 10);
  return m === '00' ? `${hourNum}` : `${hourNum}:${m}`;
}

function getLocalDateStr(dateObj = new Date()) {
  const year = dateObj.getFullYear();
  const month = String(dateObj.getMonth() + 1).padStart(2, '0');
  const day = String(dateObj.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function autoUpdatePastPlannedShifts() {
  const now = new Date();
  const todayStr = getLocalDateStr(now);
  shifts.forEach(s => {
    if (s.type === 'planned') {
      if (s.date < todayStr) {
        s.type = 'completed';
        saveShiftToCloud(s);
      }
    }
  });
}

function switchNav(viewId) {
  autoUpdatePastPlannedShifts();
  currentView = viewId;
  document.getElementById('calendar-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('analytics-view').style.display = 'none';
  document.getElementById('nav-calendar').classList.remove('active');
  document.getElementById('nav-list').classList.remove('active');
  document.getElementById('nav-analytics').classList.remove('active');
  document.getElementById(viewId).style.display = 'block';
  if (viewId === 'calendar-view') {
    document.getElementById('nav-calendar').classList.add('active');
    renderCalendar();
  } else if (viewId === 'list-view') {
    document.getElementById('nav-list').classList.add('active');
    renderListView();
  } else if (viewId === 'analytics-view') {
    document.getElementById('nav-analytics').classList.add('active');
    renderAnalytics();
  }
}

function populateTimeOptions() {
  const startSelect = document.getElementById('start-time');
  const endSelect = document.getElementById('end-time');
  let optionsHtml = '';
  for (let h = 7; h < 23; h++) {
    const hourStr = String(h).padStart(2, '0');
    optionsHtml += `<option value="${hourStr}:00">${hourStr}:00</option>`;
    optionsHtml += `<option value="${hourStr}:15">${hourStr}:15</option>`;
    optionsHtml += `<option value="${hourStr}:30">${hourStr}:30</option>`;
    optionsHtml += `<option value="${hourStr}:45">${hourStr}:45</option>`;
  }
  startSelect.innerHTML = optionsHtml;
  endSelect.innerHTML = optionsHtml;
}

function updateCompanyDatalist() {
  const companyList = document.getElementById('company-list');
  const savedCompanies = [...new Set(shifts.map(s => s.company).filter(Boolean))];
  companyList.innerHTML = savedCompanies.map(c => `<option value="${c}"></option>`).join('');

function openModal(selectedDateStr = null) {
  modalOverlay.classList.add('active');
  const targetDate = selectedDateStr || getLocalDateStr();
  document.getElementById('modal-title').textContent = "有工番啦🤑";

  document.getElementById('company').value = "";

  document.getElementById('rate').value = "";

  document.getElementById('deduct-minutes').value = "30";

function openShiftDetail(shiftId) {
  const shift = shifts.find(s => s.id === shiftId);
  if (!shift) return;
  modalOverlay.classList.add('active');
  document.getElementById('modal-title').textContent = "傻仔打錯野？";
  document.getElementById('editing-shift-id').value = shift.id;
  document.getElementById('btn-delete-modal').style.display = "block";
  document.getElementById('date-range-container').style.display = "block";
  document.getElementById('date-range-box').style.display = "none";
  document.getElementById('date-picker-trigger').style.display = "none";
  document.getElementById('date-tag-badge').style.display = "block";
  document.getElementById('date-tag-badge').textContent = `已選 ${shift.date}`;
  updateCompanyDatalist();
  initMiniCalendar(shift.date, false);
  setShiftType(shift.type || 'completed');
  document.getElementById('company').value = shift.company;
  document.getElementById('event-name').value = shift.eventName === '-' ? '' : shift.eventName;
  document.getElementById('rate').value = shift.rate;
  document.getElementById('allowance').value = shift.allowance || "";
  document.getElementById('start-time').value = shift.startTime;
  document.getElementById('end-time').value = shift.endTime;
  if (shift.deductMins > 0) {
    document.getElementById('no-lunch-check').checked = true;
    document.getElementById('deduct-minutes').value = shift.deductMins;
    document.getElementById('deduct-wrapper').classList.add('active');
  } else {
    document.getElementById('no-lunch-check').checked = false;
    document.getElementById('deduct-wrapper').classList.remove('active');
  }
  calcDuration();
}

function closeModal() { modalOverlay.classList.remove('active'); }

function initMiniCalendar(dateStr, canSelectRange) {
  const d = new Date(dateStr);
  miniCalYear = d.getFullYear();
  miniCalMonth = d.getMonth();
  modalRangeStart = dateStr;
  modalRangeEnd = null;
  allowRangeSelection = canSelectRange;
  selectedDatesList = [dateStr];
  renderMiniCalendar();
}

function renderMiniCalendar() {
  document.getElementById('mini-cal-month-year').textContent = `${miniCalYear} 年 ${miniCalMonth + 1} 月`;
  const daysContainer = document.getElementById('mini-cal-days');
  daysContainer.innerHTML = '';
  let rawFirstDay = new Date(miniCalYear, miniCalMonth, 1).getDay();
  let firstDay = (rawFirstDay === 0) ? 6 : rawFirstDay - 1;
  const totalDays = new Date(miniCalYear, miniCalMonth + 1, 0).getDate();
  for (let i = 0; i < firstDay; i++) {
    daysContainer.appendChild(document.createElement('div')).className = 'mini-cal-cell other-month';
  }
  for (let day = 1; day <= totalDays; day++) {
    const dateStr = `${miniCalYear}-${String(miniCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const cell = document.createElement('div');
    cell.className = 'mini-cal-cell';
    if (dateStr === modalRangeStart) cell.classList.add('range-start');
    cell.innerHTML = `<span class="mini-cal-num">${day}</span>`;
    cell.onclick = () => {
      modalRangeStart = dateStr;
      selectedDatesList = [dateStr];
      renderMiniCalendar();
    };
    daysContainer.appendChild(cell);
  }
}

function setShiftType(type) {
  document.getElementById('shift-type').value = type;
  document.getElementById('btn-submit-text').textContent = (type === 'completed') ? '儲存已完成工時' : '儲存排班';
}

function toggleDeductInput() {
  const isChecked = document.getElementById('no-lunch-check').checked;
  document.getElementById('deduct-wrapper').classList.toggle('active', isChecked);
  calcDuration();
}

function getCalculatedDuration() {
  const startTime = document.getElementById('start-time').value;
  const endTime = document.getElementById('end-time').value;
  if (!startTime || !endTime) return 0;
  const [sH, sM] = startTime.split(':').map(Number);
  const [eH, eM] = endTime.split(':').map(Number);
  let diff = (eH * 60 + eM) - (sH * 60 + sM);
  if (diff < 0) diff += 24 * 60;
  if (document.getElementById('no-lunch-check').checked) {
    diff = Math.max(0, diff - (parseFloat(document.getElementById('deduct-minutes').value) || 0));
  }
  return Math.round((diff / 60) * 100) / 100;
}

function calcDuration() {
  document.getElementById('duration-display').textContent = `共 ${getCalculatedDuration()} 小時`;
}

function formatMoney(value) {
  return (Math.floor((Number(value) + Number.EPSILON) * 100) / 100).toLocaleString();
}

function getShiftPay(s) {
  return (s.rate || 0) * (s.duration || 0) + (Number(s.allowance) || 0);
}

shiftForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const editingId = document.getElementById('editing-shift-id').value;
  const duration = getCalculatedDuration();
  const isDeduct = document.getElementById('no-lunch-check').checked;
  const deductMins = isDeduct ? (parseFloat(document.getElementById('deduct-minutes').value) || 0) : 0;
  let type = document.getElementById('shift-type').value;
  const company = document.getElementById('company').value.trim();
  const eventName = document.getElementById('event-name').value.trim() || "-";
  const rate = parseFloat(document.getElementById('rate').value);
  const allowance = parseFloat(document.getElementById('allowance').value) || 0;
  const startTime = document.getElementById('start-time').value;
  const endTime = document.getElementById('end-time').value;

  if (editingId) {
    const updated = { id: Number(editingId), type, date: modalRangeStart, company, eventName, rate, allowance, startTime, endTime, deductMins, duration };
    const idx = shifts.findIndex(s => s.id == editingId);
    if (idx !== -1) shifts[idx] = updated;
    await saveShiftToCloud(updated);
  } else {
    for (let i = 0; i < selectedDatesList.length; i++) {
      const newShift = { id: Date.now() + i, type, date: selectedDatesList[i], company, eventName, rate, allowance, startTime, endTime, deductMins, duration };
      shifts.push(newShift);
      await saveShiftToCloud(newShift);
    }
  }
  renderCurrentView();
  closeModal();
});

async function deleteCurrentEditingShift() {
  const editingId = document.getElementById('editing-shift-id').value;
  if (editingId) {
    shifts = shifts.filter(s => s.id !== Number(editingId));
    await deleteShiftFromCloud(Number(editingId));
    renderCurrentView();
    closeModal();
  }
}

function renderCurrentView() {
  if (currentView === 'calendar-view') renderCalendar();
  else if (currentView === 'list-view') renderListView();
  else if (currentView === 'analytics-view') renderAnalytics();
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderCurrentView();
}

function renderCalendar() {
  document.getElementById('calendar-month-year').textContent = `${currentYear} 年 ${currentMonth + 1} 月`;
  const daysContainer = document.getElementById('calendar-days');
  daysContainer.innerHTML = '';
  
  let rawFirstDay = new Date(currentYear, currentMonth, 1).getDay();
  let firstDay = (rawFirstDay === 0) ? 6 : rawFirstDay - 1;
  const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
  const prevLastDay = new Date(currentYear, currentMonth, 0).getDate();
  const today = new Date();
  
  let mPayCompleted = 0, mPayTotal = 0;

  const createCellContent = (dayNum, dateStr, isCurrentMonth) => {
    let html = `<span class="day-number">${dayNum}</span>`;
    const dayShifts = shifts.filter(s => s.date === dateStr);
    let shiftsHtml = '';
    
    dayShifts.forEach(s => {
      const pay = getShiftPay(s);
      if (isCurrentMonth) {
        mPayTotal += pay;
        if (s.type === 'completed') mPayCompleted += pay;
      }
      shiftsHtml += `
      <div class="shift-dot-item" onclick="event.stopPropagation(); openShiftDetail(${s.id});">
        <div class="comp-name">${s.company}</div>
        <div class="shift-money">$${formatMoney(pay)}</div>
      </div>`;
    });
    return html + `<div class="shift-items-wrap">${shiftsHtml}</div>`;
  };

  for (let i = firstDay - 1; i >= 0; i--) {
    const cell = document.createElement('div');
    cell.className = 'day-cell other-month';
    cell.innerHTML = createCellContent(prevLastDay - i, '', false);
    daysContainer.appendChild(cell);
  }

  for (let day = 1; day <= totalDays; day++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    cell.onclick = () => openModal(dateStr);
    if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) cell.classList.add('today');
    cell.innerHTML = createCellContent(day, dateStr, true);
    daysContainer.appendChild(cell);
  }

  document.getElementById('month-pay').textContent = `$ ${formatMoney(mPayCompleted)}`;
  document.getElementById('month-total-est').textContent = `$ ${formatMoney(mPayTotal)}`;
}

function renderListView() {
  const filterTabsContainer = document.getElementById('company-filter-tabs');
  const listContainer = document.getElementById('shift-list-container');
  const companies = [...new Set(shifts.map(s => s.company))];
  filterTabsContainer.innerHTML = `<button class="filter-btn ${selectedCompanyFilter === 'ALL' ? 'active' : ''}" onclick="filterListCompany('ALL')">全部</button>` + 
    companies.map(c => `<button class="filter-btn ${selectedCompanyFilter === c ? 'active' : ''}" onclick="filterListCompany('${c}')">${c}</button>`).join('');

  let filteredShifts = selectedCompanyFilter === 'ALL' ? shifts : shifts.filter(s => s.company === selectedCompanyFilter);
  filteredShifts.sort((a,b) => new Date(b.date) - new Date(a.date));

  if (filteredShifts.length === 0) {
    listContainer.innerHTML = `<div class="empty-msg">沒有相關工時紀錄</div>`;
    return;
  }
  listContainer.innerHTML = filteredShifts.map(s => `
  <div class="shift-list-item" onclick="openShiftDetail(${s.id})">
    <div class="shift-info">
      <h4>${s.company}</h4>
      <p>${s.date} • ${s.startTime} - ${s.endTime}</p>
    </div>
    <div class="shift-amount">
      <div class="price">$${formatMoney(getShiftPay(s))}</div>
      <div class="hrs">${s.duration}小時</div>
    </div>
  </div>`).join('');
}

function filterListCompany(comp) {
  selectedCompanyFilter = comp;
  renderListView();
}

function renderAnalytics() {
  document.getElementById('analytics-month-year').textContent = `${currentYear} 年 ${currentMonth + 1} 月`;
  const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
  const monthShifts = shifts.filter(s => s.date && s.date.startsWith(monthPrefix));
  let totalHours = 0, totalPay = 0;
  monthShifts.forEach(s => {
    if (s.type === 'completed') {
      totalHours += s.duration;
      totalPay += getShiftPay(s);
    }
  });
  document.getElementById('stat-hours').textContent = `${Math.round(totalHours * 10) / 10}h`;
  document.getElementById('stat-total-pay').textContent = `$${formatMoney(totalPay)}`;
}

function openActionMenu() { document.getElementById('action-menu-overlay').classList.add('active'); }
function closeActionMenu() { document.getElementById('action-menu-overlay').classList.remove('active'); }

function exportJSON() {
  const content = JSON.stringify(shifts, null, 2);
  const blob = new Blob([content], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `backup_${syncKey}_${getLocalDateStr()}.json`;
  a.click();
}

function importJSON() { document.getElementById('import-file').click(); }
function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        updateSyncStatus('syncing', '正在將 JSON 資料匯入雲端...');
        
        // 使用 Promise.all 確保所有資料均上傳至 Supabase
        for (let item of data) {
          const shiftObj = {
            id: Number(item.id),
            date: item.date,
            company: item.company,
            eventName: item.eventName || item.event_name || '-',
            rate: Number(item.rate) || 0,
            allowance: Number(item.allowance) || 0,
            startTime: item.startTime || item.start_time,
            endTime: item.endTime || item.end_time,
            deductMins: Number(item.deductMins || item.deduct_mins) || 0,
            duration: Number(item.duration) || 0,
            type: item.type || 'completed'
          };
          await saveShiftToCloud(shiftObj);
        }
        
        // 上傳完成後，重新從雲端抓取並更新畫面
        await loadShiftsFromCloud();
        alert('🎉 成功將 ' + data.length + ' 筆紀錄匯入至雲端！');
      }
    } catch (err) {
      console.error(err);
      alert('解析檔案失敗，請確認是否為有效的 JSON 備份檔。');
    }
  };
  reader.readAsText(file);
}

async function confirmClearAll() {
  if (confirm(`確定要清空 Sync Key「${syncKey}」的所有雲端紀錄嗎？`)) {
    await db.from('shifts').delete().eq('sync_key', syncKey);
    shifts = [];
    renderCurrentView();
    alert('已清空雲端紀錄');
  }
}

// 頁面初始化
populateTimeOptions();
initDarkMode();
initSyncKey();
</script>
