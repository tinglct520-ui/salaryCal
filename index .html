<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>兼職工時及薪酬管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
--bg-color: #f5f8fc;
--card-bg: #ffffff;
--primary: #6d90c4;
--primary-dark: #3f5f8f;
--primary-hover: #3f5f8f;
--primary-light: #eaf1fb;
--text-main: #212529;
--text-sub: #6c757d;
--border-color: #f5f8fa;
--accent-price: #2e7d32;
--plan-bg: #eaf1fb;
--plan-border: #90b8e0;
--danger: #e53935;
--holiday-red: #e53935;
--nav-height: 50px;
--safe-bottom: env(safe-area-inset-bottom, 0px);
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Nunito', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
-webkit-tap-highlight-color: transparent;
}
html, body {
height: 100%;
}
body {
background-color: var(--bg-color);
padding: 4px 10px calc(var(--nav-height) + var(--safe-bottom) + 42px) 10px;
display: flex;
justify-content: center;
align-items: flex-start;
min-height: 100dvh;
}
.container {
width: 100%;
max-width: 600px;
display: flex;
flex-direction: column;
gap: 13px;
min-height: calc(100dvh - var(--nav-height) - var(--safe-bottom) - 24px);
}
.top-header {
display: flex;
justify-content: center;
align-items: center;
padding: 2px 5px;
position: relative;
}
.top-header h1 {
color: var(--primary-dark);
font-size: 1.35rem;
font-weight: 800;
text-align: center;
width: 100%;
}
.card {
background-color: var(--card-bg);
border-radius: 20px;
box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
overflow: hidden;
}
.cardTitle {
padding: 18px;
}
.month-salary-card {
background: linear-gradient(135deg, #8fb1e0, var(--primary-dark));
border-radius: 18px;
padding: 18px 20px;
color: white;
display: flex;
justify-content: space-between;
align-items: center;
box-shadow: 0 6px 15px rgba(63, 95, 143, 0.28);
}
.salary-box {
display: flex;
flex-direction: column;
}
.salary-box span {
font-size: 0.76rem;
color: rgba(255, 255, 255, 0.85);
font-weight: 600;
}
.salary-box strong {
font-size: 1.35rem;
color: #ffffff;
font-weight: 800;
margin-top: 2px;
}
.salary-divider {
width: 1px;
height: 35px;
background-color: rgba(255, 255, 255, 0.25);
}
.calendar-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
}
.calendar-header h2 {
font-size: 1.1rem;
color: var(--primary-dark);
font-weight: 800;
}
.month-nav {
display: flex;
gap: 8px;
}
.btn-nav {
background-color: var(--primary-light);
color: var(--primary-dark);
border: none;
width: 32px;
height: 32px;
border-radius: 50%;
font-size: 1rem;
cursor: pointer;
font-weight: 700;
}
.calendar-weekdays {
display: grid;
grid-template-columns: repeat(7, 1fr);
text-align: center;
font-weight: 700;
color: var(--text-main);
margin-bottom: 0;
padding-bottom: 8px;
font-size: 0.78rem;
border-bottom: 1px solid var(--border-color);
}
.calendar-weekdays .sun-label {
color: var(--holiday-red);
font-weight: 800;
}
.calendar-days {
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
display: grid;
grid-template-columns: repeat(7, 1fr);
grid-auto-rows: minmax(88px, auto);
}
.day-cell {
min-height: 88px;
max-height: 132px;
padding: 3px 0;
display: flex;
flex-direction: column;
align-items: center;
cursor: pointer;
background-color: #ffffff;
transition: all 0.15s;
overflow: hidden;
border-bottom: 1px solid var(--border-color);
border-right: 1px solid var(--border-color);
}
.day-cell:hover {
background-color: #eef3f9;
}
.day-cell.other-month {
opacity: 0.25;
background-color: transparent;
}
.day-number {
font-weight: 700;
font-size: 0.72rem;
line-height: 1;
margin-bottom: 3px;
flex-shrink: 0;
}
.day-cell.today {
background-color: #F2F6FC;
}
.day-cell.today .day-number {
color: var(--primary-dark);
background: var(--primary-light);
}
.day-cell.is-holiday .day-number,
.day-cell.is-holiday.today .day-number {
color: var(--holiday-red);
}
.day-cell.is-holiday.today .day-number {
background: #fdecea;
}
.holiday-label {
font-size: 0.5rem;
line-height: 1.05;
color: var(--holiday-red);
font-weight: 700;
text-align: center;
max-width: 100%;
overflow: hidden;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
flex-shrink: 0;
margin-bottom: 1px;
}
.shift-items-wrap {
width: 100%;
display: flex;
flex-direction: column;
gap: 1px;
overflow-y: auto;
flex: 1;
min-height: 0;
}
.shift-dot-item {
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
touch-action: none;
background-color: var(--primary-dark);
padding: 1px 0;
width: 100%;
text-align: center;
cursor: pointer;
transition: background-color 0.2s;
font-size: 0.56rem;
font-weight: 700;
line-height: 1.3;
flex-shrink: 0;
}
.shift-dot-item .comp-name {
color: #ffffff;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
font-size: 0.6rem;
}
.shift-dot-item .shift-time {
color: #ffffff;
font-size: 0.6rem;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.shift-dot-item .shift-money {
font-weight: 800;
font-size: 0.55rem;
color: #ffffff;
}
.shift-dot-item:hover {
filter: brightness(0.95);
}
.shift-dot-item.long-press-dragging { opacity: 0.55; transform: scale(0.98); }
.day-cell.drop-target { outline: 2px dashed var(--primary-dark); outline-offset: -3px; background: #E7F0FF !important; }
#calendar-view {
margin-bottom: calc(var(--nav-height) + var(--safe-bottom) + 42px);
}
#list-view {
margin-bottom: calc(var(--nav-height) + var(--safe-bottom) + 42px);
}
#analytics-view{
margin-bottom: calc(var(--nav-height) + var(--safe-bottom) + 42px);
}
.list-filter-bar {
display: flex;
gap: 8px;
overflow-x: auto;
padding-bottom: 8px;
margin-bottom: 12px;
}
.filter-btn {
background-color: #edf2f7;
border: 1.5px solid transparent;
padding: 6px 14px;
border-radius: 20px;
font-size: 0.8rem;
font-weight: 700;
color: var(--text-sub);
cursor: pointer;
white-space: nowrap;
transition: all 0.2s ease;
}
.filter-btn.active {
background-color: var(--primary);
color: white;
}
.shift-list-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px;
border-bottom: 1px solid var(--border-color);
cursor: pointer;
}
.shift-list-item:hover {
background-color: #fcfdfc;
}
.shift-list-item:last-child {
border-bottom: none;
}
.shift-info h4 {
font-size: 0.95rem;
color: var(--text-main);
}
.shift-info p {
font-size: 0.78rem;
color: var(--text-sub);
margin-top: 2px;
}
.shift-amount {
text-align: right;
}
.shift-amount .price {
font-size: 1rem;
font-weight: 800;
color: var(--accent-price);
}
.shift-amount .hrs {
font-size: 0.75rem;
color: var(--text-sub);
}
/* Analytics Styles */
.analytics-summary-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 8px;
margin-bottom: 16px;
}
.stat-box {
background: var(--primary-light);
border-radius: 14px;
padding: 12px 8px;
text-align: center;
display: flex;
flex-direction: column;
gap: 4px;
}
.stat-box span {
font-size: 0.68rem;
color: var(--primary-dark);
font-weight: 700;
}
.stat-box strong {
font-size: 1.05rem;
color: var(--text-main);
font-weight: 800;
}
.analytics-section-title {
font-size: 0.88rem;
font-weight: 800;
color: var(--primary-dark);
margin: 16px 0 8px 0;
display: flex;
justify-content: space-between;
align-items: center;
}
.company-stat-item {
padding: 12px;
border-bottom: 1px solid var(--border-color);
background: #fafbfc;
border-radius: 12px;
margin-bottom: 8px;
/* 改用 Grid 布局 */
display: grid;
grid-template-columns: 1fr auto; /* 左欄自適應，右欄依內容寬度 */
grid-template-rows: auto auto; /* 上下兩行 */
align-items: center; /* 垂直居中對齊 */
column-gap: 12px; /* 左右欄間距 */
row-gap: 4px; /* 左欄上下列間距 */
}
.company-stat-item:last-child {
margin-bottom: 0;
}
.company-stat-top {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 6px;
}
/* 左欄 Row 1 */
.company-stat-name {
grid-column: 1;
grid-row: 1;
font-size: 0.88rem;
font-weight: 800;
display: flex;
align-items: center;
gap: 6px;
}
.company-stat-dot {
width: 9px;
height: 9px;
border-radius: 50%;
display: inline-block;
}
/* 右欄 佔據 2 Rows */
.company-stat-pay {
grid-column: 2;
grid-row: 1 / span 2; /* 縱跨第一與第二列 */
font-size: 1.1rem;
font-weight: 800;
color: var(--accent-price);
text-align: right;
}
/* 左欄 Row 2 */
.company-stat-meta {
grid-column: 1;
grid-row: 2;
font-size: 0.74rem;
color: var(--text-sub);
display: flex;
justify-content: space-between;
align-items: center;
}
.payday-tag {
font-size: 0.7rem;
padding: 2px 8px;
border-radius: 6px;
font-weight: 700;
}
.payday-tag.due {
background: #e8f5e9;
color: #2e7d32;
}
.payday-tag.pending {
background: #fff3e0;
color: #e65100;
}
.company-stat-bar-bg {
width: 100%;
height: 6px;
background: var(--border-color);
border-radius: 4px;
margin-top: 8px;
overflow: hidden;
}
.company-stat-bar-fill {
height: 100%;
border-radius: 4px;
}
/* Payday Settings Block */
.payday-setting-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 8px 4px;
font-size: 0.82rem;
border-bottom: 1px dashed var(--border-color);
}
.payday-setting-row select {
padding: 4px 8px;
border-radius: 8px;
border: 1px solid var(--border-color);
font-weight: 700;
color: var(--primary-dark);
background: #f8f9fa;
}
.fixed-bottom-nav {
position: fixed;
bottom: 0;
left: 0;
right: 0;
height: calc(var(--nav-height) + var(--safe-bottom));
padding-bottom: var(--safe-bottom);
background-color: #ffffff;
border-top: 1px solid #e9ecef;
display: flex;
justify-content: space-around;
align-items: center;
z-index: 999;
box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
padding-left: 4px;
padding-right: 4px;
}
.nav-item {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
background: none;
border: none;
color: var(--text-sub);
font-size: 0.62rem;
font-weight: 700;
cursor: pointer;
gap: 2px;
height: 100%;
min-width: 0;
}
.nav-item svg {
width: 25px;
height: 25x;
fill: currentColor;
}
.nav-item.active {
color: var(--primary-dark);
}
.nav-item-add-container {
flex: 1;
display: flex;
justify-content: center;
align-items: center;
position: relative;
max-width: 70px;
}
.btn-add-highlight {
width: 42px;
height: 42px;
border-radius: 50%;
background: linear-gradient(135deg, #8fb1e0, var(--primary-dark));
color: white;
border: 4px solid #ffffff;
display: flex;
justify-content: center;
align-items: center;
font-size: 1.7rem;
cursor: pointer;
transition: transform 0.2s;
}
.btn-add-highlight:active {
transform: scale(0.92);
}
.modal-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.4);
backdrop-filter: blur(4px);
display: none;
justify-content: center;
align-items: flex-start;
z-index: 1000;
padding: 15px;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
overscroll-behavior: contain;
}
.modal-overlay.active {
display: flex;
}
.modal-content {
background-color: var(--card-bg);
width: 100%;
max-width: 480px;
border-radius: 20px;
padding: 22px;
box-shadow: 0 10px 30px rgba(0,0,0,0.15);
margin: 15px auto 40px auto;
-webkit-overflow-scrolling: touch;
}
.modal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
position: relative;
}
.modal-header h2 {
font-size: 1.2rem;
color: var(--primary-dark);
font-weight: 800;
text-align: center;
width: 100%;
}
.close-btn {
background: none;
border: none;
font-size: 1.4rem;
cursor: pointer;
color: var(--text-sub);
position: absolute;
right: 0;
top: 50%;
transform: translateY(-50%);
}
.date-tag-badge {
display: inline-block;
background: var(--primary-light);
color: var(--primary-dark);
font-weight: 700;
font-size: 0.98rem;
padding: 9px 14px;
border-radius: 10px;
}
.company-input-wrapper {
position: relative;
}
.company-input-wrapper input {
width: 100%;
padding-right: 34px;
}
.company-input-wrapper::after {
content: '';
position: absolute;
right: 14px;
top: 50%;
width: 8px;
height: 8px;
border-right: 2px solid var(--text-sub);
border-bottom: 2px solid var(--text-sub);
transform: translateY(-65%) rotate(45deg);
pointer-events: none;
}
.analytics-summary-grid.grid-3 {
grid-template-columns: repeat(3, 1fr);
}
.date-range-box {
background: #f0f5fa;
border: 1px solid #d4e2f2;
border-radius: 12px;
padding: 10px 12px 12px 12px;
}
.mini-cal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 8px;
}
.mini-cal-header span {
font-weight: 800;
font-size: 0.88rem;
color: var(--primary-dark);
}
.mini-cal-header .btn-nav {
width: 26px;
height: 26px;
font-size: 0.85rem;
}
.mini-cal-weekdays {
display: grid;
grid-template-columns: repeat(7, 1fr);
text-align: center;
font-size: 0.68rem;
font-weight: 700;
color: var(--text-sub);
margin-bottom: 4px;
}
.mini-cal-days {
display: grid;
grid-template-columns: repeat(7, 1fr);
row-gap: 2px;
}
.mini-cal-cell {
position: relative;
height: 34px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
}
.mini-cal-cell.other-month {
visibility: hidden;
pointer-events: none;
}
.mini-cal-cell.in-range::before {
content: '';
position: absolute;
top: 0;
bottom: 0;
left: 0;
right: 0;
background: var(--primary-light);
}
.mini-cal-cell.in-range.range-start::before {
left: 50%;
}
.mini-cal-cell.in-range.range-end::before {
right: 50%;
}
.mini-cal-num {
position: relative;
z-index: 1;
width: 27px;
height: 27px;
display: flex;
align-items: center;
justify-content: center;
border-radius: 50%;
font-size: 0.76rem;
font-weight: 700;
border: 1.5px solid transparent;
box-sizing: border-box;
}
.mini-cal-cell.today .mini-cal-num {
border-color: var(--primary-dark);
}
.mini-cal-cell.is-holiday .mini-cal-num {
color: var(--holiday-red);
}
.mini-cal-cell.range-start .mini-cal-num,
.mini-cal-cell.range-end .mini-cal-num {
background: var(--primary-dark);
border-color: var(--primary-dark);
color: #fff !important;
}
.date-summary-text {
font-size: 0.78rem;
font-weight: 700;
color: var(--primary-dark);
margin-top: 6px;
}
.form-grid {
display: flex;
flex-direction: column;
gap: 12px;
}
.input-group {
display: flex;
flex-direction: column;
gap: 4px;
}
.input-group label {
font-size: 0.82rem;
font-weight: 700;
color: var(--primary-dark);
}
.input-group input {
padding: 9px 12px;
border: 1.5px solid var(--border-color);
border-radius: 10px;
font-size: 0.9rem;
outline: none;
background-color: #fdfdfc;
}
.time-range-group {
display: flex;
gap: 8px;
align-items: center;
}
.time-range-group input {
flex: 1;
}
.checkbox-group {
display: flex;
align-items: center;
gap: 6px;
margin-top: 2px;
}
.checkbox-group input[type="checkbox"] {
width: 16px;
height: 16px;
accent-color: var(--primary);
}
.checkbox-group label {
font-size: 0.85rem;
cursor: pointer;
font-weight: 600;
}
.deduct-input-wrapper {
display: none;
margin-top: 4px;
padding: 8px 10px;
background-color: #f0f5fa;
border-radius: 8px;
}
.deduct-input-wrapper.active {
display: flex;
align-items: center;
gap: 8px;
}
.calculated-duration {
font-size: 0.82rem;
color: var(--primary-dark);
font-weight: 800;
}
.modal-btn-group {
display: flex;
gap: 10px;
margin-top: 8px;
}
.btn-submit {
flex: 1;
background-color: var(--primary-dark);
color: white;
border: none;
padding: 12px;
border-radius: 12px;
font-size: 0.95rem;
font-weight: 800;
cursor: pointer;
}
.btn-delete-item {
background-color: #ffebee;
color: var(--danger);
border: 1px solid #ffcdd2;
padding: 12px;
border-radius: 12px;
font-size: 0.9rem;
font-weight: 700;
cursor: pointer;
}
.action-menu-overlay {
position: fixed;
top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0,0,0,0.3);
display: none;
justify-content: center;
align-items: flex-end;
z-index: 1001;
}
.action-menu-overlay.active {
display: flex;
}
.action-sheet {
background: white;
width: 100%;
max-width: 600px;
border-radius: 20px 20px 0 0;
padding: 20px;
padding-bottom: calc(20px + var(--safe-bottom));
display: flex;
flex-direction: column;
gap: 10px;
}
.action-sheet-title {
text-align: center;
font-weight: 800;
color: var(--primary-dark);
font-size: 0.95rem;
margin-bottom: 4px;
}
.action-sheet-btn {
padding: 12px;
border: 1px solid var(--border-color);
background: #f8f9fa;
border-radius: 12px;
font-weight: 700;
font-size: 0.9rem;
cursor: pointer;
text-align: center;
}
.action-sheet-btn.primary {
background: var(--primary-light);
color: var(--primary-dark);
}
.action-sheet-btn.danger {
background: #ffebee;
color: var(--danger);
}
#move-copy-overlay { background: transparent; justify-content: flex-start; align-items: flex-start; }
#move-copy-overlay .action-sheet { width: auto; min-width: 142px; max-width: 210px; border: 1px solid var(--border-color); border-radius: 12px; padding: 6px; padding-bottom: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.16); gap: 4px; }
#move-copy-overlay .action-sheet-title { text-align: left; font-size: 0.72rem; padding: 4px 7px; margin-bottom: 0; white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
#move-copy-overlay .action-sheet-btn { padding: 7px 9px; border: 0; border-radius: 8px; font-size: 0.76rem; text-align: left; white-space: nowrap; }

.empty-msg {
text-align: center;
padding: 30px;
color: var(--text-sub);
font-size: 0.88rem;
}
</style>
</head>
<body>
<div class="container">
<div class="top-header">
<h1>🔥打工狗請努力🔥</h1>
</div>
<div class="month-salary-card">
<div class="salary-box">
<span>血汗已換取</span>
<strong id="month-pay">$ 0</strong>
</div>
<div class="salary-divider"></div>
<div class="salary-box">
<span style="text-align:right;">本月努力指數</span>
<strong id="month-total-est" style="text-align:right;">$ 0</strong>
</div>
</div>
<!-- VIEW 1: Calendar View -->
<div id="calendar-view" class="card">
<div class="calendar-header cardTitle">
<h2 id="calendar-month-year"></h2>
<div class="month-nav">
<button class="btn-nav" id="prev-month">&lt;</button>
<button class="btn-nav" id="next-month">&gt;</button>
</div>
</div>
<div class="calendar-weekdays">
<div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div class="sun-label">日</div>
</div>

}
}
});

function initMiniCalendar(dateStr, canSelectRange) {
const d = new Date(dateStr);
miniCalYear = d.getFullYear();
miniCalMonth = d.getMonth();
modalRangeStart = dateStr;
modalRangeEnd = null;
allowRangeSelection = canSelectRange;
selectedDatesList = [dateStr];
renderMiniCalendar();
updateDateSummary();
}
function renderMiniCalendar() {
document.getElementById('mini-cal-month-year').textContent = `${miniCalYear} 年 ${miniCalMonth + 1} 月`;
const daysContainer = document.getElementById('mini-cal-days');
daysContainer.innerHTML = '';
let rawFirstDay = new Date(miniCalYear, miniCalMonth, 1).getDay();
let firstDay = (rawFirstDay === 0) ? 6 : rawFirstDay - 1;
const totalDays = new Date(miniCalYear, miniCalMonth + 1, 0).getDate();
const today = new Date();
for (let i = 0; i < firstDay; i++) {
const cell = document.createElement('div');
cell.className = 'mini-cal-cell other-month';
daysContainer.appendChild(cell);
}
for (let day = 1; day <= totalDays; day++) {
const dateStr = `${miniCalYear}-${String(miniCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
const dateObj = new Date(miniCalYear, miniCalMonth, day);
const cell = document.createElement('div');
cell.className = 'mini-cal-cell';
if (day === today.getDate() && miniCalMonth === today.getMonth() && miniCalYear === today.getFullYear()) {
cell.classList.add('today');
}
const holidayInfo = getHolidayInfo(dateStr, dateObj);
if (holidayInfo.isHoliday) cell.classList.add('is-holiday');
const isStart = dateStr === modalRangeStart;
const isEnd = modalRangeEnd ? dateStr === modalRangeEnd : isStart;
const inRange = isDateInSelectedRange(dateStr);
if (inRange) cell.classList.add('in-range');
if (isStart) cell.classList.add('range-start');
if (isEnd) cell.classList.add('range-end');
cell.innerHTML = `<span class="mini-cal-num">${day}</span>`;
cell.onclick = () => handleMiniCalClick(dateStr);
daysContainer.appendChild(cell);
}
}
function isDateInSelectedRange(dateStr) {
if (!modalRangeStart) return false;
if (!modalRangeEnd) return dateStr === modalRangeStart;
return dateStr >= modalRangeStart && dateStr <= modalRangeEnd;
}
function handleMiniCalClick(dateStr) {
if (!allowRangeSelection) {
modalRangeStart = dateStr;
modalRangeEnd = null;
selectedDatesList = [dateStr];
renderMiniCalendar();
updateDateSummary();
return;
}
if (!modalRangeStart || modalRangeEnd) {
modalRangeStart = dateStr;
modalRangeEnd = null;
} else if (dateStr === modalRangeStart) {
modalRangeEnd = null;
} else if (dateStr < modalRangeStart) {
modalRangeEnd = modalRangeStart;
modalRangeStart = dateStr;
} else {
modalRangeEnd = dateStr;
}
if (modalRangeEnd) {
selectedDatesList = [];
let cur = new Date(modalRangeStart);
const end = new Date(modalRangeEnd);
while (cur <= end) {
selectedDatesList.push(getLocalDateStr(cur));
cur.setDate(cur.getDate() + 1);
}
} else {
selectedDatesList = [modalRangeStart];
}
renderMiniCalendar();
updateDateSummary();
}
function updateDateSummary() {
document.getElementById('date-summary-text').textContent = `已選 ${selectedDatesList.length} 天`;
}

function getCalculatedDuration() {
const startTime = document.getElementById('start-time').value;
const endTime = document.getElementById('end-time').value;
if (!startTime || !endTime) return 0;
const [sHours, sMins] = startTime.split(':').map(Number);
const [eHours, eMins] = endTime.split(':').map(Number);
let startTotalMins = sHours * 60 + sMins;
let endTotalMins = eHours * 60 + eMins;
if (endTotalMins < startTotalMins) {
endTotalMins += 24 * 60;
}
let diffMins = endTotalMins - startTotalMins;
if (document.getElementById('no-lunch-check').checked) {
const deductMins = parseFloat(document.getElementById('deduct-minutes').value) || 0;
diffMins = Math.max(0, diffMins - deductMins);
}
return Math.round((diffMins / 60) * 100) / 100;
}
function calcDuration() {
const dur = getCalculatedDuration();
document.getElementById('duration-display').textContent = `共 ${dur} 小時`;
}
shiftForm.addEventListener('submit', (e) => {

const deductMins = isDeduct ? (parseFloat(document.getElementById('deduct-minutes').value) || 0) : 0;
let type = document.getElementById('shift-type').value;
const company = document.getElementById('company').value.trim();
const eventName = document.getElementById('event-name').value.trim() || "-";
const rate = parseFloat(document.getElementById('rate').value);
const startTime = document.getElementById('start-time').value;
const endTime = document.getElementById('end-time').value;
const now = new Date();
const todayStr = getLocalDateStr(now);
if (editingId) {
const targetIndex = shifts.findIndex(s => s.id == editingId);
if (targetIndex !== -1) {
let finalType = type;
if (finalType === 'planned') {
if (modalRangeStart < todayStr) {
finalType = 'completed';
} else if (modalRangeStart === todayStr) {
const [eH, eM] = endTime.split(':').map(Number);
const endDt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), eH, eM);
if (now >= endDt) finalType = 'completed';
}
}
shifts[targetIndex] = {
id: Number(editingId),
type: finalType,
date: modalRangeStart,
company: company,
eventName: eventName,
rate: rate,
startTime: startTime,
endTime: endTime,
deductMins: deductMins,
duration: duration
};
}
} else {
if (selectedDatesList.length === 0) {
alert('請選擇日期');
return;
}
selectedDatesList.forEach((dateStr, index) => {
let finalType = type;
if (finalType === 'planned') {
if (dateStr < todayStr) {
finalType = 'completed';
} else if (dateStr === todayStr) {
const [eH, eM] = endTime.split(':').map(Number);
const endDt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), eH, eM);
if (now >= endDt) finalType = 'completed';
}
}
const newShift = {
id: Date.now() + index,
type: finalType,
date: dateStr,
company: company,
eventName: eventName,
rate: rate,
startTime: startTime,
endTime: endTime,
deductMins: deductMins,
duration: duration
};
shifts.push(newShift);
});
}
saveData();
const refDate = new Date(modalRangeStart);
currentYear = refDate.getFullYear();
currentMonth = refDate.getMonth();
renderCurrentView();
closeModal();
document.getElementById('event-name').value = '';
});
function deleteCurrentEditingShift() {
const editingId = document.getElementById('editing-shift-id').value;
if (editingId) {
deleteShift(Number(editingId));
closeModal();
}
}
function deleteShift(id) {
shifts = shifts.filter(s => s.id !== id);
saveData();
renderCurrentView();
}
function renderCurrentView() {
if (currentView === 'calendar-view') { renderCalendar(); }
else if (currentView === 'list-view') { renderListView(); }
else if (currentView === 'analytics-view') { renderAnalytics(); }
else { renderCalendar(); }
if (currentView !== 'calendar-view') { updateMonthSalaryCard(); }
}
function saveData() {
localStorage.setItem('partTimeShifts', JSON.stringify(shifts));
localStorage.setItem('companyPaydays', JSON.stringify(companyPaydays));
}
async function shareOrDownloadFile(filename, mimeType, content) {
try {
const blob = new Blob([content], { type: mimeType });
const file = new File([blob], filename, { type: mimeType });
if (navigator.canShare && navigator.canShare({ files: [file] })) {
await navigator.share({
files: [file],
title: filename,
text: '兼職紀錄備份'
});
return;
}
const url = URL.createObjectURL(blob);
const link = document.createElement('a');
link.href = url;
link.download = filename;
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
setTimeout(() => URL.revokeObjectURL(url), 2000);
} catch (err) {
if (err && err.name === 'AbortError') return;
console.error('Export Error:', err);
alert('匯出失敗');
}
}
function exportJSON() {
if (shifts.length === 0) { alert('沒有紀錄可匯出'); return; }
const content = JSON.stringify(shifts, null, 2);
shareOrDownloadFile(`part_time_backup_${getLocalDateStr()}.json`, 'application/json', content);
}
function importJSON() { document.getElementById('import-file').click(); }
function handleFileSelect(event) {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(e) {
try {
const importedData = JSON.parse(e.target.result);
if (Array.isArray(importedData)) {
shifts = importedData;
autoUpdatePastPlannedShifts();
saveData();
renderCurrentView();
alert('匯入成功！');
} else { alert('無效的備份檔案'); }
} catch (err) { alert('解析檔案失敗'); }
};
reader.readAsText(file);
event.target.value = '';
}
function exportCSV() {
if (shifts.length === 0) { alert('沒有紀錄可匯出'); return; }
let csvContent = "\uFEFF";
csvContent += "日期,狀態,公司,工作備註,時薪($),開始時間,結束時間,扣除(分鐘),總時數(小時),薪金($)\n";
shifts.forEach(s => {
const pay = s.rate * s.duration;
const status = s.type === 'planned' ? '排班' : '已完成';
csvContent += `"${s.date}","${status}","${s.company}","${s.eventName}",${s.rate},"${s.startTime}","${s.endTime}",${s.deductMins},${s.duration},${pay}\n`;
});
shareOrDownloadFile(`part_time_records_${getLocalDateStr()}.csv`, 'text/csv;charset=utf-8;', csvContent);
}
function confirmClearAll() {
if (shifts.length === 0) { alert('目前沒有紀錄'); return; }
const ok = confirm('確定要清空所有資料嗎？此動作無法復原！\n建議先匯出 JSON 備份檔。');
if (ok) {
shifts = [];
saveData();
renderCurrentView();
alert('已清空所有紀錄');
}
}
function changeMonth(delta) {
currentMonth += delta;
if (currentMonth < 0) { currentMonth = 11; currentYear--; }
if (currentMonth > 11) { currentMonth = 0; currentYear++; }
autoUpdatePastPlannedShifts();
renderCurrentView();
}
document.getElementById('prev-month').addEventListener('click', () => changeMonth(-1));
document.getElementById('next-month').addEventListener('click', () => changeMonth(1));
document.getElementById('prev-month-a').addEventListener('click', () => changeMonth(-1));
document.getElementById('next-month-a').addEventListener('click', () => changeMonth(1));
function updateMonthSalaryCard() {
let mPayCompleted = 0;
let mPayTotal = 0;
const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
shifts.filter(s => s.date && s.date.startsWith(monthPrefix)).forEach(s => {
const pay = s.rate * s.duration;
mPayTotal += pay;
if (s.type === 'completed' || !s.type) mPayCompleted += pay;
});
document.getElementById('month-pay').textContent = `$ ${Math.round(mPayCompleted).toLocaleString()}`;
document.getElementById('month-total-est').textContent = `$ ${Math.round(mPayTotal).toLocaleString()}`;
}
let longPressTimer = null;
let longPressShiftId = null;
let longPressTriggered = false;
let dragShiftId = null;
let dragDestination = null;

function startShiftLongPress(event, shiftId) {
  event.preventDefault();
  if (event.pointerType === 'mouse' && event.button !== 0) return;
  cancelShiftLongPress();
  longPressShiftId = shiftId;
  longPressTriggered = false;
  const item = event.currentTarget;
  longPressTimer = setTimeout(() => {
    longPressTriggered = true;
    dragShiftId = shiftId;
    item.classList.add('long-press-dragging');
    if (navigator.vibrate) navigator.vibrate(20);
    document.body.classList.add('dragging-shift');
  }, 550);
}
function cancelShiftLongPress() {
  if (longPressTimer) clearTimeout(longPressTimer);
  longPressTimer = null;
}
function clearDropTarget() {
  document.querySelectorAll('.day-cell.drop-target').forEach(el => el.classList.remove('drop-target'));
}
function finishShiftDrag() {
  cancelShiftLongPress();
  document.querySelectorAll('.long-press-dragging').forEach(el => el.classList.remove('long-press-dragging'));
  document.body.classList.remove('dragging-shift');
  if (dragShiftId && dragDestination) {
    const shift = shifts.find(s => s.id === dragShiftId);
    if (shift && dragDestination !== shift.date) {
      window.pendingShiftId = dragShiftId;
      window.pendingShiftDestination = dragDestination;
      document.getElementById('move-copy-title').textContent = `${shift.company} → ${dragDestination}`;
      const targetCell = document.querySelector(`.day-cell[data-date="${dragDestination}"]`);
      const sheet = document.querySelector('#move-copy-overlay .action-sheet');
      if (targetCell && sheet) {
        const rect = targetCell.getBoundingClientRect();
        const left = Math.min(window.innerWidth - 218, Math.max(8, rect.right - 8));
        const top = Math.min(window.innerHeight - 105, Math.max(8, rect.top + 8));
        sheet.style.position = 'fixed';
        sheet.style.left = `${left}px`;
        sheet.style.top = `${top}px`;
      }
      document.getElementById('move-copy-overlay').classList.add('active');
    }
  }
  clearDropTarget();
  dragShiftId = null;
  longPressShiftId = null;
  dragDestination = null;
}
function closeMoveCopyMenu() {
  document.getElementById('move-copy-overlay').classList.remove('active');
  const sheet = document.querySelector('#move-copy-overlay .action-sheet');
  if (sheet) { sheet.style.left = ''; sheet.style.top = ''; }
  dragShiftId = null;
  longPressShiftId = null;
  dragDestination = null;
}
function moveOrCopyShift(mode) {
  const destination = window.pendingShiftDestination;
  const shiftId = window.pendingShiftId;
  const shift = shifts.find(s => s.id === shiftId);
  if (!shift || !destination) return closeMoveCopyMenu();
  if (mode === 'move') shift.date = destination;
  else shifts.push({ ...shift, id: Date.now(), date: destination });
  saveData();
  const refDate = new Date(destination + 'T12:00:00');
  currentYear = refDate.getFullYear();
  currentMonth = refDate.getMonth();
  window.pendingShiftDestination = null;
  window.pendingShiftId = null;
  closeMoveCopyMenu();
  renderCurrentView();
}
document.addEventListener('pointermove', event => {
  if (!dragShiftId) return;
  event.preventDefault();
  const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.day-cell[data-date]');
  clearDropTarget();
  if (target) {
    target.classList.add('drop-target');
    dragDestination = target.dataset.date;
  }
});
document.addEventListener('pointerup', () => {
  if (dragShiftId) {
    window.pendingShiftId = dragShiftId;
    window.pendingShiftDestination = dragDestination;
    finishShiftDrag();
  } else cancelShiftLongPress();
});
/* Render Calendar */
function renderCalendar() {
autoUpdatePastPlannedShifts();
document.getElementById('calendar-month-year').textContent = `${currentYear} 年 ${currentMonth + 1} 月`;
const daysContainer = document.getElementById('calendar-days');
daysContainer.innerHTML = '';
let rawFirstDay = new Date(currentYear, currentMonth, 1).getDay();
let firstDay = (rawFirstDay === 0) ? 6 : rawFirstDay - 1;
const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
const prevLastDay = new Date(currentYear, currentMonth, 0).getDate();
const today = new Date();
for (let i = firstDay - 1; i >= 0; i--) {
const cell = document.createElement('div');
cell.className = 'day-cell other-month';
cell.innerHTML = `<span class="day-number">${prevLastDay - i}</span>`;
daysContainer.appendChild(cell);
}
let mPayCompleted = 0;
let mPayTotal = 0;
for (let day = 1; day <= totalDays; day++) {
const cell = document.createElement('div');
cell.className = 'day-cell';
const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
cell.dataset.date = dateStr;
const dateObj = new Date(currentYear, currentMonth, day);
const holidayInfo = getHolidayInfo(dateStr, dateObj);
cell.onclick = () => {
openModal(dateStr);
};
if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
cell.classList.add('today');
}
if (holidayInfo.isHoliday) {
cell.classList.add('is-holiday');
}
let html = `<span class="day-number">${day}</span>`;
if (holidayInfo.isHoliday && holidayInfo.label) {
html += `<div class="holiday-label">${holidayInfo.label}</div>`;
}
const dayShifts = shifts.filter(s => s.date === dateStr);
let shiftsHtml = '';
dayShifts.forEach(s => {
const pay = s.rate * s.duration;
mPayTotal += pay;
if (s.type === 'completed' || !s.type) {
mPayCompleted += pay;
}
const isPlanned = s.type === 'planned';
const timeTag = `${formatShortTime(s.startTime)}-${formatShortTime(s.endTime)}`;
shiftsHtml += `
<div class="shift-dot-item ${isPlanned ? 'planned' : ''}" onclick="event.stopPropagation(); if (!longPressTriggered) openShiftDetail(${s.id}); longPressTriggered = false;" onpointerdown="startShiftLongPress(event, ${s.id})" onpointercancel="cancelShiftLongPress()" title="${s.company} (${timeTag}) $${pay}">
<div class="comp-name">${s.company}</div>
<div class="shift-time">${timeTag}</div>
<div class="shift-money">$${Math.round(pay)}</div>
</div>
`;
});
html += `<div class="shift-items-wrap">${shiftsHtml}</div>`;
cell.innerHTML = html;
daysContainer.appendChild(cell);
}
const totalRendered = firstDay + totalDays;
const nextDays = (7 - (totalRendered % 7)) % 7;
for (let i = 1; i <= nextDays; i++) {
const cell = document.createElement('div');
cell.className = 'day-cell other-month';
cell.innerHTML = `<span class="day-number">${i}</span>`;
daysContainer.appendChild(cell);
}
document.getElementById('month-pay').textContent = `$ ${Math.round(mPayCompleted).toLocaleString()}`;
document.getElementById('month-total-est').textContent = `$ ${Math.round(mPayTotal).toLocaleString()}`;
}
/* Render List View */
function renderListView() {
autoUpdatePastPlannedShifts();
updateMonthSalaryCard();
const filterTabsContainer = document.getElementById('company-filter-tabs');
const listContainer = document.getElementById('shift-list-container');
const companies = [...new Set(shifts.map(s => s.company))];
filterTabsContainer.innerHTML = `
<button class="filter-btn ${selectedCompanyFilter === 'ALL' ? 'active' : ''}" onclick="filterListCompany('ALL')">全部</button>
` + companies.map((comp, idx) => {
const color = companyColorPalette[idx % companyColorPalette.length];
const isActive = selectedCompanyFilter === comp;
const inlineStyle = isActive
? `background-color: ${color.text}; color: #ffffff; border-color: ${color.text};`
: `background-color: ${color.bg}; color: ${color.text}; border-color: ${color.border};`;
return `
<button class="filter-btn ${isActive ? 'active' : ''}" style="${inlineStyle}" onclick="filterListCompany('${comp}')">${comp}</button>
`;
}).join('');
let filteredShifts = selectedCompanyFilter === 'ALL' ? shifts : shifts.filter(s => s.company === selectedCompanyFilter);
filteredShifts.sort((a,b) => new Date(b.date) - new Date(a.date));
if (filteredShifts.length === 0) {
listContainer.innerHTML = `<div class="empty-msg">沒有相關工時紀錄</div>`;
return;
}
listContainer.innerHTML = filteredShifts.map(s => {
const pay = s.rate * s.duration;
const isPlanned = s.type === 'planned';
return `
<div class="shift-list-item" onclick="openShiftDetail(${s.id})">
<div class="shift-info">
<h4>${s.company} ${isPlanned ? '<span style="color:#1976d2; font-size:0.75rem;">(排班)</span>' : ''}</h4>
<p>${s.date} • ${s.startTime || ''} - ${s.endTime || ''} ${s.eventName !== '-' ? ' • ' + s.eventName : ''}</p>
</div>
<div class="shift-amount">
<div class="price">$${Math.round(pay).toLocaleString()}</div>
<div class="hrs">${s.duration}小時 ($${s.rate}/hr)</div>
</div>
</div>
`;
}).join('');
}
function filterListCompany(comp) {
selectedCompanyFilter = comp;
renderListView();
}
/* Render Analytics View */
function renderAnalytics() {
autoUpdatePastPlannedShifts();
updateMonthSalaryCard();
document.getElementById('analytics-month-year').textContent = `${currentYear} 年 ${currentMonth + 1} 月`;
const monthPrefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
// 計入該月份所有紀錄 (包含已完成及預計/排班)
const monthShifts = shifts.filter(s => s.date && s.date.startsWith(monthPrefix));
let totalHours = 0;
let totalPay = 0;
const companyMap = {};
monthShifts.forEach(s => {
const pay = s.rate * s.duration;
if (s.type === 'completed' || !s.type) {
totalHours += s.duration;
totalPay += pay;
}
if (!companyMap[s.company]) {
companyMap[s.company] = { hours: 0, pay: 0, totalEstPay: 0, count: 0 };
}
companyMap[s.company].totalEstPay += pay;
if (s.type === 'completed' || !s.type) {
companyMap[s.company].hours += s.duration;
companyMap[s.company].pay += pay;
companyMap[s.company].count += 1;
}
});
const avgRate = totalHours > 0 ? (totalPay / totalHours) : 0;
document.getElementById('stat-hours').textContent = `${Math.round(totalHours * 10) / 10}h`;
document.getElementById('stat-total-pay').textContent = `$${Math.round(totalPay).toLocaleString()}`;
const companyBreakdownContainer = document.getElementById('company-breakdown-container');
const companyEntries = Object.entries(companyMap).sort((a, b) => b[1].totalEstPay - a[1].totalEstPay);
const allCompanyNames = [...new Set(shifts.map(s => s.company))];
const today = new Date();
const currentDayNum = today.getDate();
const isCurrentViewingMonth = (today.getFullYear() === currentYear && today.getMonth() === currentMonth);
if (companyEntries.length === 0) {
companyBreakdownContainer.innerHTML = `<div class="empty-msg">本月沒有工時紀錄</div>`;
} else {
companyBreakdownContainer.innerHTML = companyEntries.map(([name, data]) => {
const idx = allCompanyNames.indexOf(name);
const color = companyColorPalette[idx % companyColorPalette.length];
const pct = totalPay > 0 ? Math.round((data.pay / totalPay) * 100) : 0;
const avgCompRate = data.hours > 0 ? Math.round(data.pay / data.hours) : 0;
const pDay = companyPaydays[name] || 7; // 預設 7 號出糧
let paydayStatusHtml = '';
return `
<div class="company-stat-item">
<div class="company-stat-name">
<span class="company-stat-dot" style="background:${color.text};"></span>
${name}
</div>
<div class="company-stat-pay">$${Math.round(data.totalEstPay).toLocaleString()}</div>
<div class="company-stat-meta">
<span>${data.count} job • ${Math.round(data.hours * 10) / 10}h ($${avgCompRate}/hr)</span>
${paydayStatusHtml}
</div>
</div>
`;
}).join('');
}
// Render 全局歷史統計
const allCompleted = shifts.filter(s => s.type === 'completed' || !s.type);
let allHours = 0, allPay = 0;
allCompleted.forEach(s => {
allHours += s.duration;
allPay += s.rate * s.duration;
});
const allCompanies = new Set(allCompleted.map(s => s.company));
document.getElementById('stat-all-hours').textContent = `${Math.round(allHours * 10) / 10}h`;
document.getElementById('stat-all-pay').textContent = `$${Math.round(allPay).toLocaleString()}`;
}
</script>
