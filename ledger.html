<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#EEF5FF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<title>我嘅帳簿</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light;--bg:#EEF5FF;--card:#FFFFFF;--soft:#E5F0FF;--text:#444444;--sub:#8A8A8A;--line:#E9F2FF;--pri:#3D72B4;--dr:#E8636F;--cr:#7A8B2E;--inp:#EFF5FF;--nav:50px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 "Nunito","Noto Sans TC",-apple-system,"PingFang HK",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:600px;padding:0 15px calc(var(--nav) + env(safe-area-inset-bottom,0px) + 90px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:4px 0 8px;display:flex;flex-direction:column;gap:8px}
.mr{display:flex;align-items:center;justify-content:space-between}
.nb{background:var(--soft);border:0;color:var(--pri);width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.tm{background:none;border:0;color:var(--pri);font:800 1.1rem "Nunito","Noto Sans TC",sans-serif;display:flex;align-items:center;gap:4px;cursor:pointer;padding:6px 10px}
.tm svg{width:14px;height:14px}
.msc{background:linear-gradient(135deg,#6FA3E0,#4A7FC0);border-radius:18px;padding:16px 12px;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 15px rgba(0,0,0,.15);gap:6px}
.sb{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.sb span{font-size:.8rem;color:rgba(255,255,255,.88);font-weight:600}
.sb strong{font-size:1.08rem;font-weight:800;margin-top:2px;white-space:nowrap}
.sb.cr strong{color:#E4F5A8}.sb.dr strong{color:#FFC9CE}
.dv{width:1px;height:35px;background:rgba(255,255,255,.25)}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;z-index:40;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100%;background:none;border:0;color:#444;cursor:pointer;font:700 .66rem "Nunito","Noto Sans TC",sans-serif}
.ni svg{width:24px;height:24px;fill:currentColor}
.ni.on{color:var(--pri)}
.mpy{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px;font-size:1.15rem;font-weight:800;color:var(--pri)}
.mpy button{background:var(--soft);border:0;color:var(--pri);width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.mpg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mpm{padding:14px 0;border-radius:12px;border:2px solid transparent;background:var(--soft);color:var(--text);font:800 1rem "Nunito","Noto Sans TC",sans-serif;cursor:pointer}
.mpm.on{border-color:var(--pri);color:var(--pri)}
.mpm.now{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.07);padding:14px 16px;margin-top:12px;overflow:hidden}
.ttl{font-weight:800;font-size:.9rem;color:var(--pri);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.ttl small{font-size:.8rem;font-weight:400;color:var(--sub);line-height:1.4}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:14px;padding:10px 12px;background:var(--soft)}
.box span{display:block;font-size:.8rem;color:var(--sub)}
.box b{font-size:1.25rem;font-weight:800}
.box.dr{border-left:4px solid var(--dr)}.box.dr b{color:var(--dr)}
.box.cr{border-left:4px solid var(--cr)}.box.cr b{color:var(--cr)}
.net{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.8rem;color:var(--sub)}
.net b{font-size:1.5rem;font-weight:800}
.pos{color:var(--cr)}.neg{color:var(--dr)}
.row{display:grid;grid-template-columns:42px 1fr 76px 76px;gap:6px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.row.h{cursor:default;border-top:0;padding-top:0;font-size:.8rem;font-weight:800;color:var(--sub)}
.row .d{font-size:.8rem;color:var(--sub)}
.row .n b{display:block;font-size:.9rem;color:var(--pri)}
.row .n span{display:block;font-size:.8rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{text-align:right;font-weight:800;font-size:.9rem}
.a.dr{color:var(--dr)}.a.cr{color:var(--cr)}
.h .dr{color:var(--dr);text-align:right}.h .cr{color:var(--cr);text-align:right}
.row.t{cursor:default;border-top:2px solid var(--text);font-weight:800;background:var(--soft);margin:6px -16px 0;padding:9px 16px}
.row.op{cursor:default;color:var(--sub);font-size:.8rem}
.empty{text-align:center;color:var(--sub);padding:22px 0;font-size:.9rem}
.btn{border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:800;padding:11px 16px;cursor:pointer;font-size:.9rem}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px);width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#6FA3E0,#4A7FC0);color:#fff;font-size:2rem;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.3);cursor:pointer;z-index:30}
.fab:active{transform:scale(.92)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:99}
.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.hd{position:relative;text-align:center;font-weight:800;color:var(--pri);font-size:1.1rem;margin-bottom:12px}
.hd .x{position:absolute;right:0;top:-2px;background:none;border:0;font-size:1.3rem;color:var(--sub);cursor:pointer}
.hd .del{position:absolute;left:0;top:1px;padding:4px 9px;border:1px solid var(--dr);border-radius:8px;background:none;color:var(--dr);font-size:.75rem;font-weight:700;cursor:pointer}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg button{padding:12px 6px;border-radius:14px;border:2px solid transparent;background:var(--soft);color:var(--sub);font-weight:800;font-size:.9rem;cursor:pointer;line-height:1.3}
.tg button small{display:block;font-size:.8rem;font-weight:600}
.tg button.on.dr{border-color:var(--dr);color:var(--dr)}.tg button.on.cr{border-color:var(--cr);color:var(--cr)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{padding:7px 11px;border-radius:20px;border:1px solid var(--line);background:var(--soft);color:var(--text);font-size:.85rem;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
label{display:block;font-size:.8rem;color:var(--sub);margin-top:8px}
input{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--inp);color:var(--text);font-size:16px;margin-top:4px;font-family:inherit}
.big{font-size:1.4rem;font-weight:800}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.lg{font-size:.8rem;min-width:0}
.lg .t{display:flex;justify-content:space-between;gap:6px}
.lg .t span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .t b{font-weight:800}
.lg small{font-size:.6rem;color:var(--sub)}
.pb{height:5px;border-radius:3px;background:var(--soft);margin-top:3px;overflow:hidden}.pb i{display:block;height:100%}
.mt{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:6px;text-align:right;font-size:.8rem;padding:6px 0;border-top:1px solid var(--line)}
.mt span:first-child{text-align:left;font-weight:800}
.note{font-size:.8rem;color:var(--sub);margin-top:10px}
.gc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.gt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:14px;border:2px solid transparent;background:var(--soft);font:800 .75rem "Nunito","Noto Sans TC",sans-serif;cursor:pointer}
.gt span{font-size:1.7rem;line-height:1.1}
.gt.dr{color:var(--dr)}.gt.cr{color:var(--cr)}
.gt.on{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.gt.on.dr{border-color:var(--dr)}.gt.on.cr{border-color:var(--cr)}
.disp{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dchip{position:relative;flex-shrink:0;margin:0;background:var(--soft);border-radius:10px;padding:10px 8px;font-size:.8rem;font-weight:800;color:var(--pri);white-space:nowrap;cursor:pointer}
.dchip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;cursor:pointer}
.disp>input{flex:1;min-width:0;margin:0;padding:10px}
.av{text-align:right;min-width:0;max-width:44%;overflow:hidden}
.av b{display:block;font-size:1.5rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av small{color:var(--sub);font-size:.8rem}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad button{height:50px;border:0;border-radius:12px;background:var(--soft);color:var(--text);font:800 1.3rem "Nunito",sans-serif;cursor:pointer}
.pad button:active{filter:brightness(.92)}
.pad .op{background:var(--line)}
.pad .ok{grid-column:4;grid-row:3 / span 2;height:auto;background:var(--pri);color:#fff;font-size:1.1rem}
.stl{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--sub);padding:0 4px}
.stl span{cursor:pointer}.stl button{background:var(--soft);border:0;color:var(--pri);border-radius:8px;padding:3px 9px;font:700 .8rem "Nunito","Noto Sans TC",sans-serif;cursor:pointer}
.seg{display:flex;gap:8px;margin-top:12px}.seg button{flex:1;padding:9px;border:0;border-radius:12px;background:var(--soft);color:var(--sub);font:800 .9rem "Nunito","Noto Sans TC",sans-serif;cursor:pointer}.seg button.on{background:var(--pri);color:#fff}
/* entry popup = online.html 新增支出 */
.gc{grid-template-columns:repeat(5,1fr);gap:6px 4px;margin-bottom:14px}
.gt{background:transparent;border-radius:14px;padding:8px 0}
.gt.on{background:transparent;box-shadow:none}
.disp{background:var(--soft);border-radius:16px;padding:12px 16px;gap:10px;margin-bottom:10px}
.dchip{display:flex;align-items:center;gap:4px;align-self:stretch;background:none;border-radius:0;padding:0 2px;font-size:.85rem}
.disp>input{background:transparent;border:0;outline:0;font-size:1rem;padding:6px 0}
.av b{font-size:1.6rem}
.pad{gap:8px 8px}.pad button{border-radius:14px;height:50px}
.pad .op{background:var(--soft);}
</style>
</head>
<body>
<div id="app">
 <div class="top">
  <div class="mr"><button class="nb" onclick="mv(-1)" aria-label="上個月">‹</button>
  <button class="tm" onclick="openMP()"><span id="mon"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  <button class="nb" onclick="mv(1)" aria-label="下個月">›</button></div>
  <div class="msc"><div class="sb cr"><span>入數 Debit ▲</span><strong id="sc"></strong></div><div class="dv"></div><div class="sb dr"><span>支出 Expenses ▼</span><strong id="sd"></strong></div></div>
  <div class="stl"><span id="st" onclick="pull()">☁️ 連接中…</span><button onclick="setKey()">🔑 PIN</button></div>
 </div>
 <div id="v"></div>
</div>
<button class="fab" onclick="openF()" aria-label="新增">+</button>
<nav class="nav"><button class="ni" id="t0" onclick="tab('cur')"><svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h13v3H5v1h15a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6zm14 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg><span>現時開支</span></button><button class="ni" id="t1" onclick="tab('non')"><svg viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7L12 2zM4 11v7H2v2h20v-2h-2v-7h-2v7h-3v-7h-2v7h-2v-7H9v7H6v-7H4z"/></svg><span>大數餘額</span></button><button class="ni" id="t2" onclick="tab('an')"><svg viewBox="0 0 24 24"><path d="M4 20V10h4v10H4zm6 0V4h4v16h-4zm6 0v-7h4v7h-4z"/></svg><span>分析</span></button></nav>
<div class="ov" id="ov" onclick="if(event.target===this)closeF()"><div class="sh" id="sh"></div></div>
<script>
const CATS={debit:[['⭐','星星'],['🧹','工人姐姐'],['📦','其他']],credit:[['💰','入數']]};
const COL=['#E8636F','#42a5f5','#66bb6a','#ffa726','#ab47bc','#26c6da','#8d6e63','#9e9e9e'];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=n=>{n=Math.round(n*100)/100;return n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})};
const SB_URL='https://klmzarwylgsgbhqtpeua.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsbXphcnd5bGdzZ2JocXRwZXVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MzUxODksImV4cCI6MjEwNzAxMTE4OX0.LPUgFh7FoDQuhlyf90LvYeYmcYidSAESCOhivfcNRj4';
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let E=LS('dc-ledger-v1',[]).map(e=>({...e,acct:e.acct||'cur'}));
let pend=LS('dc-pend',{up:[],del:[]}),sk=localStorage.getItem('dc-sync-key')||'',db=null;
const save=()=>{try{localStorage.setItem('dc-ledger-v1',JSON.stringify(E));localStorage.setItem('dc-pend',JSON.stringify(pend))}catch(e){}};
const setSt=t=>{$('#st').textContent=t};
function initDb(){db=(window.supabase&&sk)?window.supabase.createClient(SB_URL,SB_KEY,{global:{headers:{'x-sync-key':sk}}}):null}
const toRow=e=>({id:e.id,sync_key:sk,acct:e.acct,type:e.type,cat:e.cat,date:e.date,note:e.note||'',amt:e.amt});
const newId=()=>Date.now()*1000+Math.floor(Math.random()*1000);
async function flush(){
 if(!db)return false;
 try{
  const up=E.filter(e=>pend.up.includes(e.id)).map(toRow);
  if(up.length){const r=await db.from('ledger_entries').upsert(up);if(r.error)throw r.error}
  if(pend.del.length){const r=await db.from('ledger_entries').delete().in('id',pend.del).eq('sync_key',sk);if(r.error)throw r.error}
  pend={up:[],del:[]};save();return true;
 }catch(err){console.error(err);setSt('⚠️ 同步失敗 · 資料暫存本機（撳呢度重試）');return false}
}
async function pull(){
 if(!sk){setSt('📴 本機模式 · 撳 PIN 設定同步');return}
 if(!db){setSt('⚠️ 未能載入 Supabase');return}
 setSt('☁️ 同步中…');
 if(!(await flush()))return;
 const r=await db.from('ledger_entries').select('*').eq('sync_key',sk);
 if(r.error){console.error(r.error);setSt('⚠️ 讀取失敗 · 檢查 table / RLS（撳呢度重試）');return}
 if(!r.data.length&&E.length){pend.up=E.map(e=>e.id);save();if(!(await flush()))return}
 else{E=r.data.map(x=>({id:+x.id,acct:x.acct||'cur',type:x.type,cat:x.cat,date:String(x.date).slice(0,10),note:x.note||'',amt:+x.amt}));save()}
 setSt('☁️ 已同步');render();
}
function setKey(){
 const v=prompt('輸入 PIN（Sync Key，最少 8 個字元）\n手機同電腦用同一個 PIN 就會同步：',sk);
 if(v===null)return;const k=v.trim();
 if(k.length<8)return alert('PIN 最少 8 個字元');
 sk=k;localStorage.setItem('dc-sync-key',sk);initDb();pull();
}
function push(e){if(!pend.up.includes(e.id))pend.up.push(e.id);save();return flush().then(ok=>{if(ok)setSt('☁️ 已同步')})}
function pushDel(id){pend.up=pend.up.filter(x=>x!==id);pend.del.push(id);save();return flush().then(ok=>{if(ok)setSt('☁️ 已同步')})}
const now=new Date(),today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
let ym=today.slice(0,7),pg='cur',ac='cur',F=null;
const EA=()=>E.filter(e=>e.acct===ac);
const ACN={cur:'現時開支 Current',non:'大數餘額 Non-current'};
const ic=(t,c)=>((CATS[t].find(x=>x[1]===c)||[t==='debit'?'💸':'💰'])[0]);
const amt=(l,t)=>l.filter(e=>e.type===t).reduce((a,e)=>a+e.amt,0);
const sgn=n=>(n<0?'-':'')+'$'+fm(Math.abs(n));
const cls=n=>n<0?'neg':'pos';
function mv(n){const d=new Date(+ym.slice(0,4),+ym.slice(5)-1+n,1);ym=d.getFullYear()+'-'+pad(d.getMonth()+1);render()}
function tab(p){pg=p;if(p!=='an')ac=p;render()}
function month(k){return EA().filter(e=>e.date.startsWith(k))}
function render(){
 $('#mon').textContent=ym.slice(0,4)+'年'+(+ym.slice(5))+'月';
 ['cur','non','an'].forEach((k,i)=>$('#t'+i).className='ni'+(pg===k?' on':''));
 const M=month(ym),cr=amt(M,'credit'),dr=amt(M,'debit'),n=cr-dr;
 $('#sc').textContent='$'+fm(cr);$('#sd').textContent='$'+fm(dr);$('#v').innerHTML=pg==='an'?analysis():ledger();
}
function ledger(){
 const L=month(ym).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
 const dr=amt(L,'debit'),cr=amt(L,'credit');
 const open=EA().filter(e=>e.date<ym+'-01').reduce((a,e)=>a+(e.type==='credit'?e.amt:-e.amt),0);
 let bal=open;
 const close=open+cr-dr;
 let h=`<div class="card" style="padding:10px 16px"><div class="net" style="margin:0"><span>期末結餘 Closing balance</span><b class="${cls(close)}">${sgn(close)}</b></div></div>`;
 h+=`<div class="card" style="padding-bottom:0"><div class="ttl"><span>${ac==='cur'?'📒':'🏦'} ${ACN[ac]}</span><small>撳一筆可修改 / 刪除</small></div><div class="row h"><span>日期</span><span>項目</span><span class="dr">支出</span><span class="cr">入數 Dr</span></div>`;
 h+=`<div class="row op"><span></span><span>承上結餘</span><span></span><span class="a ${cls(open)}">${sgn(open)}</span></div>`;
 if(!L.length&&!EA().length)h+=`<div class="empty">未有帳目<br><button class="btn" style="margin-top:10px" onclick="demo()">載入示範資料</button></div>`;
 else if(!L.length)h+='<div class="empty">呢個月未有帳目 · 撳右下角 +</div>';
 L.forEach(e=>{bal+=e.type==='credit'?e.amt:-e.amt;
  h+=`<div class="row" onclick="openF(${e.id})"><span class="d">${+e.date.slice(5,7)}/${+e.date.slice(8)}</span><div class="n"><b>${ic(e.type,e.cat)} ${esc(e.cat)}</b><span>${esc(e.note)||'—'}</span></div><span class="a dr">${e.type==='debit'?'$'+fm(e.amt):''}</span><span class="a cr">${e.type==='credit'?'$'+fm(e.amt):''}</span></div>`});
 h+=`<div class="row t"><span></span><span>合計 Total</span><span class="a dr">$${fm(dr)}</span><span class="a cr">$${fm(cr)}</span></div></div>`;
 return h;
}
function cat(L,t){
 const m={};L.filter(e=>e.type===t).forEach(e=>m[e.cat]=(m[e.cat]||0)+e.amt);
 const a=Object.entries(m).sort((x,y)=>y[1]-x[1]),tot=a.reduce((s,c)=>s+c[1],0);
 if(!tot)return '<div class="empty">呢個月未有記錄</div>';
 return '<div class="leg">'+a.map(([c,v],i)=>`<div class="lg"><div class="t"><span>${ic(t,c)} ${esc(c)}</span><b>$${fm(v)}</b></div><div class="t"><span></span><small>${(v/tot*100).toFixed(1)}%</small></div><div class="pb"><i style="width:${v/tot*100}%;background:${t==='debit'?COL[i%8]:'var(--cr)'}"></i></div></div>`).join('')+'</div>';
}
function analysis(){
 const sg=`<div class="seg"><button class="${ac==='cur'?'on':''}" onclick="ac='cur';render()">現時開支</button><button class="${ac==='non'?'on':''}" onclick="ac='non';render()">大數餘額</button></div>`;
 const L=month(ym),dr=amt(L,'debit'),cr=amt(L,'credit');
 const ms=[];for(let i=5;i>=0;i--){const d=new Date(+ym.slice(0,4),+ym.slice(5)-1-i,1),k=d.getFullYear()+'-'+pad(d.getMonth()+1),l=month(k);ms.push({k,m:d.getMonth()+1,dr:amt(l,'debit'),cr:amt(l,'credit')})}
 const mx=Math.max(1,...ms.map(x=>Math.max(x.dr,x.cr))),H=100;
 let s='<svg viewBox="0 0 300 130" style="width:100%;display:block"><line x1="0" x2="300" y1="110" y2="110" stroke="var(--line)"/>';
 ms.forEach((x,i)=>{const cx=25+i*50,h1=x.dr/mx*H,h2=x.cr/mx*H;
  s+=`<rect x="${cx-15}" y="${110-h1}" width="14" height="${Math.max(h1,1.5)}" rx="3" fill="var(--dr)"/><rect x="${cx+1}" y="${110-h2}" width="14" height="${Math.max(h2,1.5)}" rx="3" fill="var(--cr)"/><text x="${cx}" y="125" text-anchor="middle" font-size="9" fill="var(--sub)">${x.m}月</text>`});
 s+='</svg>';
 const rows=ms.slice().reverse().map(x=>{const n=x.cr-x.dr;return `<div class="mt"><span>${x.m}月</span><span class="neg">-${fm(x.dr)}</span><span class="pos">+${fm(x.cr)}</span><b class="${cls(n)}">${n<0?'-':''}${fm(Math.abs(n))}</b></div>`}).join('');
 const t6=ms.reduce((a,x)=>a+x.cr-x.dr,0);
 return sg+`<div class="card"><div class="ttl"><span>⚖️ ${ACN[ac]} · 本月</span></div>
 <div class="net" style="margin:0"><span>入數 $${fm(cr)} − 支出 $${fm(dr)}${cr>0?' · 儲蓄率 '+((cr-dr)/cr*100).toFixed(1)+'%':''}</span><b class="${cls(cr-dr)}">${sgn(cr-dr)}</b></div></div>
 <div class="card"><div class="ttl"><span>📊 近 6 個月</span><small><span class="neg">■</span> 支出 <span class="pos">■</span> 入數</small></div>${s}
 <div class="mt" style="border:0;color:var(--sub)"><span></span><span>支出</span><span>入數</span><span>淨額</span></div>${rows}
 <div class="note">近 6 個月累計淨額 <b class="${cls(t6)}">${sgn(t6)}</b></div></div>
 <div class="card"><div class="ttl"><span style="color:var(--dr)">🔻 支出 Expenses · 分類</span></div>${cat(L,'debit')}</div>
 <div class="card"><div class="ttl"><span style="color:var(--cr)">🔺 入數 Debit · 來源</span></div>${cat(L,'credit')}</div>`;
}
const KEYS=['7','8','9','del','4','5','6','+','1','2','3','OK','.','0','00'];
const dlab=d=>(+d.slice(5,7))+'/'+(+d.slice(8))+(d===today?' 今日':'');
const tot=()=>String(F.amt).split('+').reduce((a,x)=>a+(parseFloat(x)||0),0);
function openF(id){
 const e=id?E.find(x=>x.id===id):null;
 F=e?{...e,amt:String(e.amt)}:{id:0,acct:ac,type:'debit',cat:CATS.debit[0][1],date:ym===today.slice(0,7)?today:ym+'-01',note:'',amt:''};
 drawF();$('#ov').classList.add('on');
}
function closeF(){$('#ov').classList.remove('on')}
function drawF(){
 const all=[...CATS.debit.map(c=>[c,'debit']),...CATS.credit.map(c=>[c,'credit'])];
 $('#sh').innerHTML=`<div class="hd">${F.id?'<button class="del" onclick="delE()">🗑 刪除</button>':''}${F.id?'編輯帳目✏️':'又亂使錢💸'}<button class="x" onclick="closeF()">✕</button></div>
 <div class="gc">${all.map(([c,t])=>`<button class="gt ${t==='debit'?'dr':'cr'}${c[1]===F.cat?' on':''}" onclick="setC('${c[1]}','${t}')"><span>${c[0]}</span>${c[1]}</button>`).join('')}</div>
 <div class="disp"><label class="dchip">📅 <span id="dl">${dlab(F.date)}</span><input id="fd" type="date" value="${F.date}" onclick="try{this.showPicker()}catch(e){}" onchange="F.date=this.value||F.date;$('#dl').textContent=dlab(F.date)"></label>
 <input id="fn" placeholder="詳情" value="${esc(F.note)}" oninput="F.note=this.value">
 <div class="av"><b id="av" class="${F.type==='debit'?'neg':'pos'}">$0</b><small id="as"></small></div></div>
 <div class="pad">${KEYS.map(k=>k==='OK'?'<button class="ok" onclick="saveE()">儲存</button>':`<button class="${k==='del'||k==='+'?'op':''}" onclick="kp('${k}')">${k==='del'?'⌫':k}</button>`).join('')}</div>`;
 ra();
}
function ra(){$('#av').textContent='$'+(F.amt||'0');$('#as').textContent=String(F.amt).includes('+')?'= $'+fm(tot()):''}
function kp(k){
 let a=String(F.amt);
 if(k==='del')a=a.slice(0,-1);
 else if(k==='+'){if(a&&!a.endsWith('+')&&!a.endsWith('.'))a+='+'}
 else if(k==='.'){const l=a.split('+').pop();if(!l.includes('.'))a+=l===''?'0.':'.'}
 else{const l=a.split('+').pop();if(l==='0'&&k!=='00')a=a.slice(0,-1);if(k==='00'&&(l===''||l==='0'))return;if(l.includes('.')&&l.split('.')[1].length>=2)return;if(a.length<14)a+=k}
 F.amt=a;ra();
}
function setC(c,t){F.cat=c;F.type=t;document.querySelectorAll('.gt').forEach(b=>b.classList.toggle('on',b.textContent.trim().endsWith(c)&&b.classList.contains(t==='debit'?'dr':'cr')));$('#av').className=t==='debit'?'neg':'pos'}
function saveE(){
 const a=Math.round(tot()*100)/100;
 if(!(a>0))return alert('請輸入金額');if(!F.date)return alert('請揀日期');
 const r={acct:F.acct||ac,type:F.type,cat:F.cat,date:F.date,note:(F.note||'').trim(),amt:a};
 let ent;if(F.id){ent=E.find(x=>x.id===F.id);Object.assign(ent,r)}else{ent={id:newId(),...r};E.push(ent)}
 ym=F.date.slice(0,7);save();closeF();render();push(ent);
}
let mpY=0;
function openMP(){mpY=+ym.slice(0,4);drawMP();$('#ov').classList.add('on')}
function mpS(n){mpY+=n;drawMP()}
function drawMP(){
 let g='';for(let m=1;m<=12;m++){const k=mpY+'-'+pad(m);g+=`<button class="mpm${k===ym?' on':''}${k===today.slice(0,7)?' now':''}" onclick="mpP('${k}')">${m}月</button>`}
 $('#sh').innerHTML=`<div class="hd">選擇月份<button class="x" onclick="closeF()">✕</button></div><div class="mpy"><button onclick="mpS(-1)">‹</button><span>${mpY}年</span><button onclick="mpS(1)">›</button></div><div class="mpg">${g}</div><button class="btn" style="width:100%;margin-top:14px;background:var(--soft);color:var(--pri)" onclick="mpP('${today.slice(0,7)}')">回到今個月</button>`;
}
function mpP(k){ym=k;closeF();render()}
function delE(){if(!confirm('刪除呢筆帳目？'))return;const id=F.id;E=E.filter(x=>x.id!==id);save();closeF();render();pushDel(id)}
function demo(){
 const m=ym,d=n=>m+'-'+pad(n);let i=1;
 [['credit','入數','月薪',1,18000],['debit','工人姐姐','工資',2,4500],['debit','星星','生活費',5,1200],['debit','其他','雜項',6,200],['credit','入數','股息',12,420],['debit','星星','學費',14,800]]
 .forEach(x=>{const e={id:newId()+i++,acct:ac,type:x[0],cat:x[1],note:x[2],date:d(x[3]),amt:x[4]};E.push(e);pend.up.push(e.id)});
 save();render();flush().then(ok=>ok&&setSt('☁️ 已同步'));
}
render();initDb();
if(sk)pull();else{setSt('📴 本機模式 · 撳 PIN 設定同步');setTimeout(setKey,400)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sk)pull()});
</script>
</body>
