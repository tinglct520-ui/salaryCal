<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薪料計算與排班系統 (雲端同步版)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }
    .sync-status {
      font-size: 14px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-left: 8px;
    }
    .sync-status.online { background: #d1fae5; color: #065f46; }
    .sync-status.offline { background: #fee2e2; color: #991b1b; }
    .sync-status.syncing { background: #fef3c7; color: #92400e; }
    
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .shift-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .btn-del {
      background: #ef4444;
      width: auto;
      padding: 4px 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>💰 薪水計算機 <span id="syncStatus" class="sync-status offline">未同步</span></h2>

    <!-- 同步 Key 設定區 -->
    <div class="card">
      <div class="form-group">
        <label>雲端同步 Key (建議輸入你的手機號碼或自訂密碼)：</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="syncKeyInput" placeholder="例如: my-secret-key-123">
          <button style="width:100px;" onclick="setSyncKey()">設定/同步</button>
        </div>
      </div>
    </div>

    <!-- 新增班次 -->
    <div class="card">
      <h3>新增班次</h3>
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="shiftDate">
      </div>
      <div class="form-group">
        <label>公司/地點</label>
        <input type="text" id="company" placeholder="例如：公司A">
      </div>
      <div class="form-group">
        <label>時薪 (HKD)</label>
        <input type="number" id="rate" value="60">
      </div>
      <div class="form-group">
        <label>開始時間 - 結束時間</label>
        <div style="display:flex; gap:8px;">
          <input type="time" id="startTime" value="09:00">
          <input type="time" id="endTime" value="18:00">
        </div>
      </div>
      <div class="form-group">
        <label>扣除休息時間 (分鐘)</label>
        <input type="number" id="deductMins" value="60">
      </div>
      <button onclick="addShift()">新增班次</button>
    </div>

    <!-- 班次列表與總計 -->
    <div class="card">
      <h3>班次紀錄</h3>
      <div id="shiftList"></div>
      <h3 style="margin-top:16px;">預計總薪水：HK$ <span id="totalSalary">0</span></h3>
    </div>
  </div>

<script>
  let shifts = [];
  let syncKey = '';
  let db = null;

  const SUPABASE_URL = 'https://dypaeposrqeomjpxicge.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5cGFlcG9zcnFlb21qcHhpY2dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNTMwMDMsImV4cCI6MjA1NTcyOTAwM30.dJ03iJIs5YmPzM-4V_qJ3O64vVWW4E4x4XN4zP1O-vM';

  // 初始化 Supabase
  function initSupabase() {
    try {
      if (window.supabase) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.error('Supabase init fail:', e);
    }
  }

  function updateSyncStatus(status, text) {
    const el = document.getElementById('syncStatus');
    if (el) {
      el.className = 'sync-status ' + status;
      el.innerText = text;
    }
  }

  function setSyncKey() {
    const val = document.getElementById('syncKeyInput').value.trim();
    if (!val) return alert('請輸入 Sync Key');
    syncKey = val;
    localStorage.setItem('salary_sync_key', syncKey);
    loadDataFromCloud();
  }

  function calculateHours(start, end, deduct) {
    if (!start || !end) return 0;
    const [sH, sM] = start.split(':').map(Number);
    const [eH, eM] = end.split(':').map(Number);
    let startMins = sH * 60 + sM;
    let endMins = eH * 60 + eM;
    if (endMins < startMins) endMins += 24 * 60; // 跨夜
    const total = (endMins - startMins - (deduct || 0)) / 60;
    return total > 0 ? total : 0;
  }

  function renderShifts() {
    const listEl = document.getElementById('shiftList');
    listEl.innerHTML = '';
    let totalPay = 0;

    shifts.forEach((s) => {
      const hours = calculateHours(s.startTime, s.endTime, s.deductMins);
      const pay = hours * (s.rate || 0);
      totalPay += pay;

      const div = document.createElement('div');
      div.className = 'shift-item';
      div.innerHTML = `
        <div>
          <strong>${s.date || '無日期'}</strong> - ${s.company || '未填公司'}<br>
          <small>${s.startTime} ~ ${s.endTime} (${hours.toFixed(1)} hrs) | HK$${pay.toFixed(1)}</small>
        </div>
        <button class="btn-del" onclick="deleteShift('${s.id}')">刪除</button>
      `;
      listEl.appendChild(div);
    });

    document.getElementById('totalSalary').innerText = totalPay.toFixed(1);
  }

  function addShift() {
    const date = document.getElementById('shiftDate').value;
    const company = document.getElementById('company').value;
    const rate = Number(document.getElementById('rate').value);
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;
    const deductMins = Number(document.getElementById('deductMins').value);

    const newShift = {
      id: Date.now().toString(),
      date,
      company,
      rate,
      startTime,
      endTime,
      deductMins
    };

    shifts.push(newShift);
    renderShifts();
    saveData();
  }

  function deleteShift(id) {
    shifts = shifts.filter(s => s.id !== id);
    renderShifts();
    saveData();
  }

  async function saveData() {
    localStorage.setItem('salary_shifts', JSON.stringify(shifts));
    if (!syncKey || !db) return;

    updateSyncStatus('syncing', '正在同步到雲端...');

    try {
      // 先刪除舊 key 紀錄再寫入，解決更新/覆蓋問題
      await db.from('user_shifts').delete().eq('sync_key', syncKey);

      if (shifts.length > 0) {
        const dbRows = shifts.map(s => ({
          sync_key: syncKey,
          shift_id: String(s.id),
          date: s.date || '',
          company: s.company || '',
          rate: Number(s.rate) || 0,
          start_time: s.startTime || '',
          end_time: s.endTime || '',
          deduct_mins: Number(s.deductMins) || 0
        }));

        const { error } = await db.from('user_shifts').insert(dbRows);
        if (error) throw error;
      }

      updateSyncStatus('online', `已同步 (${syncKey})`);
    } catch (err) {
      console.error(err);
      updateSyncStatus('offline', '同步失敗');
    }
  }

  async function loadDataFromCloud() {
    if (!syncKey || !db) return;
    updateSyncStatus('syncing', '載入雲端資料...');

    try {
      const { data, error } = await db.from('user_shifts').select('*').eq('sync_key', syncKey);
      if (error) throw error;

      if (data && data.length > 0) {
        shifts = data.map(r => ({
          id: r.shift_id,
          date: r.date,
          company: r.company,
          rate: r.rate,
          startTime: r.start_time,
          endTime: r.end_time,
          deductMins: r.deduct_mins
        }));
      } else {
        shifts = [];
      }

      renderShifts();
      updateSyncStatus('online', `已同步 (${syncKey})`);
    } catch (err) {
      console.error(err);
      updateSyncStatus('offline', '讀取失敗');
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    // 預設日期為今天
    document.getElementById('shiftDate').value = new Date().toISOString().split('T')[0];
    
    initSupabase();

    const savedKey = localStorage.getItem('salary_sync_key');
    if (savedKey) {
      syncKey = savedKey;
      document.getElementById('syncKeyInput').value = syncKey;
      loadDataFromCloud();
    } else {
      const localShifts = localStorage.getItem('salary_shifts');
      if (localShifts) {
        shifts = JSON.parse(localShifts);
        renderShifts();
      }
    }
  });
</script>
</body>
</html>
