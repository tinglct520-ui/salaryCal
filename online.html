<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="努力賺錢錢">
<meta name="theme-color" content="#EEF5FF" id="theme-color-meta">
<link rel="apple-touch-icon" href="icon.png">
<title>努力賺錢錢 (Cloud Sync)</title>
<!-- [CHANGE Z] Flaticon UIcons (regular rounded) for the bottom menu icons -->
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<!-- 引入 Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* [CHANGE N] theme colours (v3): blue + yellow + green + coral pink. Previous orange palette values in comments */
:root {
--bg-color: #EEF5FF; /* was #E9F2FF */
--card-bg: #FFFFFF;
--primary: #5E94D4; /* blue; was #DF6F41 */
--primary-dark: #3D72B4; /* deeper blue for text; was #CC5A2D */
--primary-hover: #3D72B4; /* was #CC5A2D */
--primary-light: #E5F0FF; /* was #F7D89A */
--text-main: #444444; /* was #4A2C20 */
--text-sub: #8A8A8A; /* was #9A7B6E (you left this blank - neutral grey to match #444444, change if you have a colour) */
--border-color: #E9F2FF; /* was #D3E1F3 */
--accent-price: #AAA648; /* green (income / good) */
--plan-bg: #F7D89A; /* yellow */
--plan-border: #E5BC62; /* was #DF6F41 */
--olive: #7A8B2E; /* olive green (positive amounts) */
--danger: #E8636F; /* coral pink (expense / over budget); was #e53935 */
--holiday-red: #E8636F; /* coral pink; was #e53935 */
--nav-height: 50px;
--safe-bottom: env(safe-area-inset-bottom, 0px);
--safe-top: env(safe-area-inset-top, 0px);
--input-bg: #EFF5FF;
}

/* Night Mode Colors */
body.dark-mode {
--bg-color: #2B1D18;
--card-bg: #3A2822;
--primary: #F6A79A;
--primary-dark: #F6A79A;
--primary-hover: #FFC4B8;
--primary-light: #4E352C;
--text-main: #FFF1DC;
--text-sub: #C9A99A;
--border-color: #55392F;
--accent-price: #81c784;
--plan-bg: #4E352C;
--plan-border: #8A5A4A;
--olive: #A8B85A;
--danger: #ef5350;
--holiday-red: #ef5350;
--input-bg: #4E352C;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Nunito', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
-webkit-tap-highlight-color: transparent;
}
html, body {
height: 100%;
}
body {
background-color: var(--bg-color);
padding: 0 15px calc(var(--nav-height) + var(--safe-bottom) + 42px) 15px; /* [CHANGE S] side padding 10 -> 15px; top spacing now lives in #top-sticky */
display: flex;
justify-content: center;
align-items: flex-start;
min-height: 100dvh;
transition: background-color 0.3s, color 0.3s;
}
.container {
width: 100%;
max-width: 600px;
display: flex;
flex-direction: column;
gap: 13px;
min-height: calc(100dvh - var(--nav-height) - var(--safe-bottom) - var(--safe-top) - 24px);
}
.top-header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 2px 5px;
position: relative;
}
.top-header h1 {
color: var(--primary-dark);
font-size: 1.35rem;
font-weight: 800;
text-align: center;
width: 100%;
}
.theme-toggle-btn {
position: absolute;
right: 5px;
background: var(--primary-light);
border: none;
color: var(--text-main);
width: 34px;
height: 34px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
font-size: 1.1rem;
transition: background-color 0.3s;
}
.sync-status-bar {
font-size: 0.8rem;
text-align: center;
color: var(--text-sub);
margin-top: -8px;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
}
.sync-dot {
width: 8px;
height: 8px;
border-radius: 50%;
background-color: #ccc;
display: inline-block;
}
.sync-dot.online { background-color: #4caf50; }
.sync-dot.syncing { background-color: #ff9800; }
.sync-dot.offline { background-color: #e53935; }

.card {
background-color: var(--card-bg);
border-radius: 20px;
box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
overflow: hidden;
transition: background-color 0.3s;
}
.cardTitle {
padding: 18px;
}
.month-salary-card {
background: linear-gradient(135deg, #6FA3E0, #4A7FC0);
border-radius: 18px;
padding: 18px 20px;
color: white;
display: flex;
justify-content: space-between;
align-items: center;
box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
}
.salary-box {
display: flex;
flex-direction: column;
}
.salary-box span {
font-size: 0.8rem;
color: rgba(255, 255, 255, 0.85);
font-weight: 600;
}
.salary-box strong {
font-size: 1.35rem;
color: #ffffff;
font-weight: 800;
margin-top: 2px;
}
.salary-divider {
width: 1px;
height: 35px;
background-color: rgba(255, 255, 255, 0.25);
}
.calendar-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
}
/* [CHANGE B] start: month header layout  <  title(center)  >  (applies to all 4 pages) */
.calendar-header { display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; }
.calendar-header .month-nav { display: contents; }
.calendar-header .month-nav .btn-nav:first-child { grid-column: 1; grid-row: 1; }
.calendar-header .month-nav .btn-nav:last-child { grid-column: 3; grid-row: 1; }
.calendar-header h2 { grid-column: 2; grid-row: 1; text-align: center; }
/* [CHANGE B] end */
.calendar-header h2 {
font-size: 1.1rem;
color: var(--primary-dark);
font-weight: 800;
}
.month-nav {
display: flex;
gap: 8px;
}
.btn-nav {
background-color: var(--primary-light);
color: var(--primary-dark);
border: none;
width: 32px;
height: 32px;
border-radius: 50%;
font-size: 1rem;
cursor: pointer;
font-weight: 700;
}
.calendar-weekdays {
display: grid;
grid-template-columns: repeat(7, 1fr);
text-align: center;
font-weight: 700;
color: var(--text-main);
margin-bottom: 0;
padding-bottom: 8px;
font-size: 0.78rem;
border-bottom: 1px solid var(--border-color);
}
.calendar-weekdays .sun-label {
color: var(--holiday-red);
font-weight: 800;
}
.calendar-days {
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
display: grid;
grid-template-columns: repeat(7, 1fr);
grid-auto-rows: minmax(88px, auto);
}
.day-cell {
min-height: 88px;
max-height: 132px;
padding: 3px 0;
display: flex;
flex-direction: column;
align-items: center;
cursor: pointer;
background-color: var(--card-bg);
transition: all 0.15s;
overflow: hidden;
border-bottom: 1px solid var(--border-color);
border-right: 1px solid var(--border-color);
touch-action: none !important;
}
.day-cell:hover {
filter: brightness(0.95);
}
.day-cell.other-month {
opacity: 0.3;
background-color: transparent;
}
.day-number {
color: var(--text-main);
font-weight: 700;
font-size: 0.72rem;
line-height: 1;
margin-bottom: 3px;
flex-shrink: 0;
}
.day-cell.today {
background-color: var(--primary-light);
}
.day-cell.today .day-number {
color: var(--primary-dark);
}
.day-cell.is-holiday .day-number,
.day-cell.is-holiday.today .day-number {
color: var(--holiday-red);
}
.holiday-label {
font-size: 0.5rem;
line-height: 1.05;
color: var(--holiday-red);
font-weight: 700;
text-align: center;
max-width: 100%;
overflow: hidden;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
flex-shrink: 0;
margin-bottom: 1px;
}
.shift-items-wrap {
width: 100%;
display: flex;
flex-direction: column;
gap: 1px;
overflow-y: auto;
flex: 1;
min-height: 0;
}
.shift-dot-item {
user-select: none !important;
-webkit-user-select: none !important;
-webkit-touch-callout: none !important;
touch-action: none !important;
background-color: #3D72B4;
padding: 1px 0;
width: 100%;
text-align: center;
cursor: pointer;
transition: background-color 0.2s;
font-size: 0.56rem;
font-weight: 700;
line-height: 1.3;
flex-shrink: 0;
}
body.dark-mode .shift-dot-item {
background-color: #3D72B4;
}
.shift-dot-item .comp-name {
color: #ffffff;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
font-size: 0.6rem;
}
.shift-dot-item .shift-time {
color: #ffffff;
font-size: 0.6rem;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.shift-dot-item .shift-money {
font-weight: 800;
font-size: 0.55rem;
color: #ffffff;
}
.shift-dot-item:hover {
filter: brightness(0.9);
}
.shift-dot-item.long-press-dragging {
opacity: 0.7 !important;
transform: scale(1.08) !important;
z-index: 9999 !important;
box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3) !important;
pointer-events: none !important;
}
.day-cell.drop-target {
outline: 2px dashed var(--primary);
outline-offset: -3px;
background: var(--primary-light) !important;
}
#calendar-view, #list-view, #analytics-view, #analysis-view, #overall-view {
margin-bottom: calc(var(--nav-height) + var(--safe-bottom) + 42px);
}
.list-filter-bar {
display: flex;
gap: 8px;
overflow-x: auto;
padding-bottom: 8px;
margin-bottom: 12px;
}
.filter-btn {
background-color: var(--primary-light);
border: 1.5px solid transparent;
padding: 6px 14px;
border-radius: 20px;
font-size: 0.8rem;
font-weight: 700;
color: var(--text-sub);
cursor: pointer;
white-space: nowrap;
transition: all 0.2s ease;
}
.filter-btn.active {
background-color: var(--primary);
color: white;
}
.shift-list-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px;
border-bottom: 1px solid var(--border-color);
cursor: pointer;
}
.shift-list-item:hover {
filter: brightness(0.97);
}
.shift-list-item:last-child {
border-bottom: none;
}
.shift-info h4 {
font-size: 0.95rem;
color: var(--text-main);
}
.shift-info p {
font-size: 0.8rem;
color: var(--text-sub);
margin-top: 2px;
}
.shift-amount {
text-align: right;
}
.shift-amount .price {
font-size: 1rem;
font-weight: 800;
color: var(--accent-price);
}
.shift-amount .hrs {
font-size: 0.8rem;
color: var(--text-sub);
}
/* Analytics Styles */
.analytics-summary-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 8px;
margin-bottom: 16px;
}
.stat-box {
background: var(--primary-light);
border-radius: 14px;
padding: 12px 8px;
text-align: center;
display: flex;
flex-direction: column;
gap: 4px;
}
.stat-box span {
font-size: 0.8rem;
color: var(--primary-dark);
font-weight: 700;
}
.stat-box strong {
font-size: 1.05rem;
color: var(--text-main);
font-weight: 800;
}
.analytics-section-title {
font-size: 0.88rem;
font-weight: 800;
color: var(--primary-dark);
margin: 16px 0 8px 0;
display: flex;
justify-content: space-between;
align-items: center;
}
.company-stat-item {
padding: 12px;
border-bottom: 1px solid var(--border-color);
background: var(--primary-light);
border-radius: 12px;
margin-bottom: 8px;
display: grid;
grid-template-columns: 1fr auto;
grid-template-rows: auto auto;
align-items: center;
column-gap: 12px;
row-gap: 4px;
}
.company-stat-item:last-child {
margin-bottom: 0;
}
.company-stat-name {
grid-column: 1;
grid-row: 1;
font-size: 0.88rem;
font-weight: 800;
color: var(--text-main);
display: flex;
align-items: center;
gap: 6px;
}
.company-stat-dot {
width: 9px;
height: 9px;
border-radius: 50%;
display: inline-block;
}
.company-stat-pay {
grid-column: 2;
grid-row: 1 / span 2;
font-size: 1.1rem;
font-weight: 800;
color: var(--accent-price);
text-align: right;
}
.company-stat-meta {
grid-column: 1;
grid-row: 2;
font-size: 0.8rem;
color: var(--text-sub);
display: flex;
flex-direction: column; /* [CHANGE E] was: justify-content: space-between; align-items: center; */
gap: 2px;
}

.fixed-bottom-nav {
position: fixed;
bottom: 0;
left: 0;
right: 0;
height: calc(var(--nav-height) + var(--safe-bottom));
padding-bottom: var(--safe-bottom);
background-color: var(--card-bg);
border-top: 1px solid var(--border-color);
display: flex;
justify-content: space-around;
align-items: center;
z-index: 999;
box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
padding-left: 4px;
padding-right: 4px;
transition: background-color 0.3s;
}
.nav-item {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
background: none;
border: none;
color: var(--text-sub);
font-size: 0.62rem;
font-weight: 700;
cursor: pointer;
gap: 2px;
height: 100%;
min-width: 0;
}
.nav-item svg {
width: 25px;
height: 25px;
fill: currentColor;
}
.nav-item.active {
color: var(--primary-dark);
}
.nav-item-add-container {
flex: 1;
display: flex;
justify-content: center;
align-items: center;
position: relative;
max-width: 70px;
}
.btn-add-highlight {
width: 42px;
height: 42px;
border-radius: 50%;
background: linear-gradient(135deg, #6FA3E0, #4A7FC0);
color: white;
border: 4px solid var(--card-bg);
display: flex;
justify-content: center;
align-items: center;
font-size: 1.7rem;
cursor: pointer;
transition: transform 0.2s, border-color 0.3s;
}
.btn-add-highlight:active {
transform: scale(0.92);
}
.modal-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.6);
backdrop-filter: blur(4px);
display: none;
justify-content: center;
align-items: center;
z-index: 1000;
padding: 15px;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
overscroll-behavior: contain;
}
.modal-overlay.active {
display: flex;
}
.modal-content {
background-color: var(--card-bg);
color: var(--text-main);
width: 100%;
max-width: 480px;
border-radius: 20px;
padding: 22px;
box-shadow: 0 10px 30px rgba(0,0,0,0.3);
margin: auto;
max-height: calc(100vh - 30px);
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}
.modal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
position: relative;
}
.modal-header h2 {
font-size: 1.2rem;
color: var(--primary-dark);
font-weight: 800;
text-align: center;
width: 100%;
}
.close-btn {
background: none;
border: none;
font-size: 1.4rem;
cursor: pointer;
color: var(--text-sub);
position: absolute;
right: 0;
top: 50%;
transform: translateY(-50%);
}
.date-tag-badge {
display: block;
background: var(--primary-light);
color: var(--primary-dark);
font-weight: 700;
font-size: 0.98rem;
padding: 9px 14px;
border-radius: 10px;
text-align:center;
}
.company-input-wrapper {
position: relative;
}
.company-input-wrapper input {
width: 100%;
padding-right: 34px;
}
.company-input-wrapper::after {
content: '';
position: absolute;
right: 14px;
top: 50%;
width: 8px;
height: 8px;
border-right: 2px solid var(--text-sub);
border-bottom: 2px solid var(--text-sub);
transform: translateY(-65%) rotate(45deg);
pointer-events: none;
}
.date-picker-trigger {
display: flex;
align-items: center;
justify-content: space-between;
background: var(--primary-light);
color: var(--primary-dark);
border: 1px solid var(--border-color);
border-radius: 10px;
padding: 10px 12px;
font-size: 0.85rem;
font-weight: 800;
cursor: pointer;
margin-bottom: 8px;
}
.date-picker-trigger::after { content: "▾"; font-size: 0.9rem; }
.date-range-box {
background: var(--primary-light);
border: 1px solid var(--border-color);
border-radius: 12px;
padding: 10px 12px 12px 12px;
}
.mini-cal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 8px;
}
.mini-cal-header span {
font-weight: 800;
font-size: 0.88rem;
color: var(--primary-dark);
}
.mini-cal-header .btn-nav {
width: 26px;
height: 26px;
font-size: 0.85rem;
}
.mini-cal-weekdays {
display: grid;
grid-template-columns: repeat(7, 1fr);
text-align: center;
font-size: 0.68rem;
font-weight: 700;
color: var(--text-sub);
margin-bottom: 4px;
}
.mini-cal-days {
display: grid;
grid-template-columns: repeat(7, 1fr);
row-gap: 2px;
}
.mini-cal-cell {
position: relative;
height: 34px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
}
.mini-cal-cell.other-month {
visibility: hidden;
pointer-events: none;
}
.mini-cal-cell.in-range::before {
content: '';
position: absolute;
top: 0;
bottom: 0;
left: 0;
right: 0;
background: var(--border-color);
}
.mini-cal-cell.in-range.range-start::before { left: 50%; }
.mini-cal-cell.in-range.range-end::before { right: 50%; }
.mini-cal-num {
position: relative;
z-index: 1;
width: 27px;
height: 27px;
display: flex;
align-items: center;
justify-content: center;
border-radius: 50%;
font-size: 0.76rem;
font-weight: 700;
color: var(--text-main);
border: 1.5px solid transparent;
box-sizing: border-box;
}
.mini-cal-cell.today .mini-cal-num {
border-color: var(--primary-dark);
}
.mini-cal-cell.is-holiday .mini-cal-num {
color: var(--holiday-red);
}
.mini-cal-cell.range-start .mini-cal-num,
.mini-cal-cell.range-end .mini-cal-num {
background: var(--primary-dark);
border-color: var(--primary-dark);
color: #fff !important;
}
.date-summary-text {
font-size: 0.8rem;
font-weight: 700;
color: var(--primary-dark);
margin-top: 6px;
}
.form-grid {
display: flex;
flex-direction: column;
gap: 12px;
}
.input-group {
display: flex;
flex-direction: column;
gap: 4px;
}
.input-group label {
font-size: 0.8rem;
font-weight: 700;
color: var(--primary-dark);
}
.input-group input, .input-group select {
padding: 9px 12px;
border: 1.5px solid var(--border-color);
border-radius: 10px;
font-size: 0.9rem;
outline: none;
background-color: var(--input-bg);
color: var(--text-main);
}
.time-range-group {
display: flex;
gap: 8px;
align-items: center;
}
.time-range-group select {
flex: 1;
}
.checkbox-group {
display: flex;
align-items: center;
gap: 6px;
margin-top: 2px;
}
.checkbox-group input[type="checkbox"] {
width: 16px;
height: 16px;
accent-color: var(--primary);
}
.checkbox-group label {
font-size: 0.85rem;
cursor: pointer;
font-weight: 600;
color: var(--text-main);
}
.deduct-input-wrapper {
display: none;
margin-top: 4px;
padding: 8px 10px;
background-color: var(--primary-light);
border-radius: 8px;
}
.deduct-input-wrapper.active {
display: flex;
align-items: center;
gap: 8px;
}
.calculated-duration {
font-size: 0.8rem;
color: var(--primary-dark);
font-weight: 800;
}
.modal-btn-group {
display: flex;
gap: 10px;
margin-top: 8px;
}
.btn-submit {
flex: 1;
background-color: var(--primary-dark);
color: #ffffff;
border: none;
padding: 12px;
border-radius: 12px;
font-size: 0.95rem;
font-weight: 800;
cursor: pointer;
}
body.dark-mode .btn-submit {
color: #2B1D18;
}
.btn-delete-item {
background-color: rgba(229, 57, 53, 0.15);
color: var(--danger);
border: 1px solid var(--danger);
padding: 12px;
border-radius: 12px;
font-size: 0.9rem;
font-weight: 700;
cursor: pointer;
}
.action-menu-overlay {
position: fixed;
top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0,0,0,0.5);
display: none;
justify-content: center;
align-items: flex-end;
z-index: 1001;

// --- Sync Key & Cloud Functions ---
function updateSyncStatus(status, text) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  if (dot && txt) {
    dot.className = 'sync-dot ' + status;
    txt.textContent = text;
  }
}

function initSupabaseClient() {
  if (window.supabase) {
    // 將 sync key 放喺獨立 header 送去，等 Supabase 個 RLS 政策可以喺資料庫層面核對，
    // 唔淨係靠前端自己加 .eq('sync_key', ...) 嚟篩選（純篩選任何人都繞得過）。
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      global: { headers: { 'x-sync-key': syncKey || '' } }
    });
  } else {
    console.error('Supabase SDK 未能載入');
  }
}

async function initSyncKey() {
  if (!syncKey) {
    const defaultKey = 'dog-' + Math.floor(100000 + Math.random() * 900000);
    const input = prompt('請輸入你的「跨裝置同步 Sync Key」\n（手機與電腦輸入同一個 Key 就能同步數據）：', defaultKey);
    syncKey = (input && input.trim()) ? input.trim() : defaultKey;
    localStorage.setItem('user_sync_key', syncKey);
    initSupabaseClient(); // sync key 啱啱先出現，重新建立 client 帶埋新 header
  }
  updateSyncStatus('online', `Sync Key: ${syncKey}`);
  await loadShiftsFromCloud();
}

function promptChangeSyncKey() {
  const newKey = prompt('修改你的 Sync Key (手機與電腦輸入相同 Key 即刻同步)：', syncKey);
  if (newKey && newKey.trim() && newKey.trim() !== syncKey) {
    syncKey = newKey.trim();
    localStorage.setItem('user_sync_key', syncKey);
    initSupabaseClient(); // 換咗 key，重新建立 client 帶埋新 header
    updateSyncStatus('online', `Sync Key: ${syncKey}`);
    loadShiftsFromCloud();
  }
}

async function loadShiftsFromCloud() {
  if (!syncKey || !db) return;
  updateSyncStatus('syncing', '正在讀取雲端資料...');
  try {
    const { data, error } = await db.from('user_shifts').select('*').eq('sync_key', syncKey);
    if (error) throw error;
    if (data && data.length > 0) {
      parseBudgetRows(data);
      shifts = data.filter(item => !BT_TYPES.includes(item.type)).map(item => ({
        id: item.shift_id ? (isNaN(item.shift_id) ? item.shift_id : Number(item.shift_id)) : Date.now(),
        type: item.type || 'completed',
        date: item.date,
        company: item.company,
        eventName: item.event_name || '-',
        rate: Number(item.rate) || 0,
        allowance: Number(item.allowance) || 0,
        startTime: (item.start_time || '').slice(0, 5), // Supabase time 欄位會回傳 09:00:00，切走秒數
        endTime: (item.end_time || '').slice(0, 5),
        deductMins: Number(item.deduct_mins) || 0,
        duration: Number(item.duration) || 0
      }));
      autoUpdatePastPlannedShifts();
      saveDataToLocalOnly();
      renderCurrentView();
      updateSyncStatus('online', `已同步 (${syncKey})`);
    } else {
      updateSyncStatus('online', `雲端無資料 (${syncKey})`);
    }
  } catch (err) {
    console.error('Cloud load error:', err);
    updateSyncStatus('offline', '網絡連線問題 (使用本地紀錄)');
  }
}

function saveDataToLocalOnly() {
  localStorage.setItem('partTimeShifts', JSON.stringify(shifts));
  localStorage.setItem('companyPaydays', JSON.stringify(companyPaydays));
  localStorage.setItem('budgetData', JSON.stringify(B));
}

async function saveData() {
  saveDataToLocalOnly();
  if (!syncKey || !db) return;
  updateSyncStatus('syncing', '正在儲存到雲端...');
  try {
    // 1. 先清空雲端對應 sync_key 的紀錄
    const { error: delError } = await db.from('user_shifts').delete().eq('sync_key', syncKey);
    if (delError) console.warn('Delete warning:', delError);

    // 2. 重新批次寫入最新資料
    const extraRows = budgetRows();
    if (shifts.length > 0 || extraRows.length > 0) {
      const dbRows = shifts.map(s => ({
        sync_key: syncKey,
        shift_id: String(s.id),
        type: s.type || 'completed',
        date: s.date || '',
        company: s.company || '',
        event_name: s.eventName || '',

        start_time: s.startTime || '',
        end_time: s.endTime || '',

        duration: Number(s.duration) || 0
      }));

    console.error('Cloud save error:', err);
    updateSyncStatus('offline', '儲存失敗，已存在本地');
  }
}

// ==================== Budget Tracker ====================

const btEsc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const btIcon = c => (BT_CATS.concat(BT_LEGACY).find(x => x[1] === c) || ['📦'])[0];
const btShortDate = d => d ? (+d.slice(5, 7)) + '/' + (+d.slice(8, 10)) : '日期';
const btUid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const btYM = () => currentYear + '-' + String(currentMonth + 1).padStart(2, '0');
const btDim = ym => new Date(+ym.slice(0, 4), +ym.slice(5), 0).getDate();

function btMonthExp(ym = btYM()) {
  const list = B.exp.filter(e => (e.date || '').startsWith(ym)).map(e => ({ ...e }));
  B.subs.forEach(s => {
    if (s.start <= ym && (!s.end || s.end >= ym)) {
      list.push({ id: 's' + s.id, sub: 1, amt: s.amt, cat: s.cat || '訂閱', note: s.name,
        date: ym + '-' + String(Math.min(s.day, btDim(ym))).padStart(2, '0') });
    }
  });
  return list;
}
function btIncomeShifts(ym = btYM()) {
  return shifts.filter(s => s.date && s.date.startsWith(ym));
}
function btIncomeTotal() {
  return btIncomeShifts().filter(s => s.type === 'completed' || !s.type).reduce((a, s) => a + getShiftPay(s), 0);
}

function budgetRows() {

// 非同步動態加載最新 1823 公眾假期
async function loadHolidays() {
  try {
    const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www.1823.gov.hk/common/ical/tc.json'));
    if (!response.ok) throw new Error('Network response was not ok');

    const data = await response.json();
    const events = data && data.vcalendar && data.vcalendar[0] && data.vcalendar[0].vevent;
    if (Array.isArray(events)) {
      events.forEach(ev => {
        const raw = ev.dtstart && ev.dtstart[0];
        if (!raw || raw.length !== 8) return;
        const dateStr = `${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}`;
        hkHolidays[dateStr] = ev.summary || hkHolidays[dateStr] || '';
      });
      renderCurrentView();
    }
  } catch (error) {
    console.warn('網絡加載公眾假期失敗，使用本地預設假期資料:', error);
  }
}

function getHolidayInfo(dateStr, dateObj) {
  const isSun = dateObj.getDay() === 0;
  const holidayName = hkHolidays[dateStr];
  if (holidayName) return { isHoliday: true, label: holidayName };
  if (isSun) return { isHoliday: true, label: '' };
  return { isHoliday: false, label: '' };
}

function getLocalDateStr(dateObj = new Date()) {

}

function autoUpdatePastPlannedShifts() {

updated = true;

}
}
});

function initMiniCalendar(dateStr, canSelectRange) {
const d = new Date(dateStr);
miniCalYear = d.getFullYear();
miniCalMonth = d.getMonth();
modalRangeStart = dateStr;
modalRangeEnd = null;
allowRangeSelection = canSelectRange;
selectedDatesList = [dateStr];
renderMiniCalendar();
updateDateSummary();
}

function renderMiniCalendar() {
document.getElementById('mini-cal-month-year').textContent = `${miniCalYear} 年 ${miniCalMonth + 1} 月`;
const daysContainer = document.getElementById('mini-cal-days');
daysContainer.innerHTML = '';
let rawFirstDay = new Date(miniCalYear, miniCalMonth, 1).getDay();
let firstDay = (rawFirstDay === 0) ? 6 : rawFirstDay - 1;
const totalDays = new Date(miniCalYear, miniCalMonth + 1, 0).getDate();
const today = new Date();
for (let i = 0; i < firstDay; i++) {
const cell = document.createElement('div');
cell.className = 'mini-cal-cell other-month';
daysContainer.appendChild(cell);
}
for (let day = 1; day <= totalDays; day++) {
const dateStr = `${miniCalYear}-${String(miniCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
const dateObj = new Date(miniCalYear, miniCalMonth, day);
const cell = document.createElement('div');
cell.className = 'mini-cal-cell';
if (day === today.getDate() && miniCalMonth === today.getMonth() && miniCalYear === today.getFullYear()) {
cell.classList.add('today');
}
const holidayInfo = getHolidayInfo(dateStr, dateObj);
if (holidayInfo.isHoliday) cell.classList.add('is-holiday');
const isStart = dateStr === modalRangeStart;
const isEnd = modalRangeEnd ? dateStr === modalRangeEnd : isStart;
const inRange = isDateInSelectedRange(dateStr);
if (inRange) cell.classList.add('in-range');
if (isStart) cell.classList.add('range-start');
if (isEnd) cell.classList.add('range-end');
cell.innerHTML = `<span class="mini-cal-num">${day}</span>`;
cell.onclick = () => handleMiniCalClick(dateStr);
daysContainer.appendChild(cell);
}
}

function isDateInSelectedRange(dateStr) {
if (!modalRangeStart) return false;
if (!modalRangeEnd) return dateStr === modalRangeStart;
return dateStr >= modalRangeStart && dateStr <= modalRangeEnd;
}

function handleMiniCalClick(dateStr) {
if (!allowRangeSelection) {
modalRangeStart = dateStr;
modalRangeEnd = null;
selectedDatesList = [dateStr];
renderMiniCalendar();
updateDateSummary();
return;
}
if (!modalRangeStart || modalRangeEnd) {
modalRangeStart = dateStr;
modalRangeEnd = null;
} else if (dateStr === modalRangeStart) {
modalRangeEnd = null;
} else if (dateStr < modalRangeStart) {
modalRangeEnd = modalRangeStart;
modalRangeStart = dateStr;
} else {
modalRangeEnd = dateStr;
}
if (modalRangeEnd) {
selectedDatesList = [];
let cur = new Date(modalRangeStart);
const end = new Date(modalRangeEnd);
while (cur <= end) {
selectedDatesList.push(getLocalDateStr(cur));
cur.setDate(cur.getDate() + 1);
}
} else {
selectedDatesList = [modalRangeStart];
}
renderMiniCalendar();
updateDateSummary();
}

function updateDateSummary() {
const summary = `已選 ${selectedDatesList.length} 天`;
const label = modalRangeEnd ? `${modalRangeStart} 至 ${modalRangeEnd}` : modalRangeStart;
document.getElementById('date-summary-text').textContent = summary;
document.getElementById('date-picker-label').textContent = label || summary;
}

function getCalculatedDuration() {
const startTime = document.getElementById('start-time').value;
const endTime = document.getElementById('end-time').value;
if (!startTime || !endTime) return 0;
const [sHours, sMins] = startTime.split(':').map(Number);
const [eHours, eMins] = endTime.split(':').map(Number);
let startTotalMins = sHours * 60 + sMins;
let endTotalMins = eHours * 60 + eMins;
if (endTotalMins < startTotalMins) {
endTotalMins += 24 * 60;
}
let diffMins = endTotalMins - startTotalMins;
if (document.getElementById('no-lunch-check').checked) {
const deductMins = parseFloat(document.getElementById('deduct-minutes').value) || 0;
diffMins = Math.max(0, diffMins - deductMins);
}
return Math.round((diffMins / 60) * 100) / 100;
}

function calcDuration() {
const dur = getCalculatedDuration();
document.getElementById('duration-display').textContent = `共 ${fmt1(dur)} 小時`;
}

function fmt1(value) {
return (Math.round((Number(value) || 0) * 10) / 10 + 0).toLocaleString(undefined, { maximumFractionDigits: 1 });
}
function formatMoney(value) {
return fmt1(value);
}

function getShiftPay(s) {
return (s.rate || 0) * (s.duration || 0) + (Number(s.allowance) || 0);
}

async function shareOrDownloadFile(filename, mimeType, content) {
try {
const blob = new Blob([content], { type: mimeType });
const file = new File([blob], filename, { type: mimeType });
if (navigator.canShare && navigator.canShare({ files: [file] })) {
await navigator.share({
files: [file],
title: filename,
text: '兼職紀錄備份'
});
return;
}
const url = URL.createObjectURL(blob);
const link = document.createElement('a');
link.href = url;
link.download = filename;
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
setTimeout(() => URL.revokeObjectURL(url), 2000);
} catch (err) {
if (err && err.name === 'AbortError') return;
console.error('Export Error:', err);
alert('匯出失敗');
}
}

// === 長按拖拽邏輯 ===
let longPressTimer = null;
let longPressShiftId = null;
let longPressTriggered = false;
let suppressClickUntil = 0; // 只喺「真係拖咗去第日」之後短暫擋住 click
let dragShiftId = null;
let dragDestination = null;
let activeDraggingElement = null;
let activePointerId = null;

function releaseActivePointerCapture() {
  if (activeDraggingElement && activePointerId != null) {
    try { activeDraggingElement.releasePointerCapture(activePointerId); } catch (e) {}
  }
  activePointerId = null;
}

function startShiftLongPress(event, shiftId) {
  if (event.pointerType === 'mouse' && event.button !== 0) return;
  
  cancelShiftLongPress();
  longPressShiftId = shiftId;
  longPressTriggered = false;
  activeDraggingElement = event.currentTarget;

  // 鎖住個指標:滑鼠喺電腦郁出粒圓點範圍時，唔會被當成 pointerleave 而取消長按
  try {
    activeDraggingElement.setPointerCapture(event.pointerId);
    activePointerId = event.pointerId;
  } catch (e) {}

  longPressTimer = setTimeout(() => {
    longPressTriggered = true;
    dragShiftId = shiftId;
    if (activeDraggingElement) {
      activeDraggingElement.classList.add('long-press-dragging');
    }
    if (navigator.vibrate) navigator.vibrate(40);
    document.body.classList.add('dragging-shift');
  }, 350);
}

function cancelShiftLongPress() {
  if (longPressTimer) clearTimeout(longPressTimer);
  longPressTimer = null;
  if (!dragShiftId) releaseActivePointerCapture();
}

function clearDropTarget() {
  document.querySelectorAll('.day-cell.drop-target').forEach(el => el.classList.remove('drop-target'));
}

function finishShiftDrag() {
  cancelShiftLongPress();
  document.querySelectorAll('.long-press-dragging').forEach(el => el.classList.remove('long-press-dragging'));
  document.body.classList.remove('dragging-shift');
  
  if (dragShiftId && dragDestination) {
    const shift = shifts.find(s => s.id == dragShiftId);
    if (shift && dragDestination !== shift.date) {
      suppressClickUntil = Date.now() + 400;
      window.pendingShiftId = dragShiftId;
      window.pendingShiftDestination = dragDestination;
      
      const titleEl = document.getElementById('move-copy-title');
      if (titleEl) titleEl.textContent = `${shift.company} → ${dragDestination}`;
      
      const targetCell = document.querySelector(`.day-cell[data-date="${dragDestination}"]`);
      const sheet = document.querySelector('#move-copy-overlay .action-sheet');
      if (targetCell && sheet) {
        const rect = targetCell.getBoundingClientRect();
        const left = Math.min(window.innerWidth - 218, Math.max(8, rect.right - 8));
        const top = Math.min(window.innerHeight - 105, Math.max(8, rect.top + 8));
        sheet.style.position = 'fixed';
        sheet.style.left = `${left}px`;
        sheet.style.top = `${top}px`;
      }
      
      const overlay = document.getElementById('move-copy-overlay');
      if (overlay) overlay.classList.add('active');
    }
  }
  releaseActivePointerCapture();
  clearDropTarget();
  dragShiftId = null;
  longPressShiftId = null;
  dragDestination = null;
  activeDraggingElement = null;
  longPressTriggered = false; // 放手就重設，唔好留住 true 擋住之後嘅 click
}

function closeMoveCopyMenu() {
  document.getElementById('move-copy-overlay').classList.remove('active');
  const sheet = document.querySelector('#move-copy-overlay .action-sheet');
  if (sheet) { sheet.style.left = ''; sheet.style.top = ''; }
  dragShiftId = null;
  longPressShiftId = null;
  dragDestination = null;
}

function moveOrCopyShift(mode) {
  const destination = window.pendingShiftDestination;
  const shiftId = window.pendingShiftId;
  const shift = shifts.find(s => s.id == shiftId);
  if (!shift || !destination) return closeMoveCopyMenu();
  if (mode === 'move') shift.date = destination;
  else shifts.push({ ...shift, id: Date.now(), date: destination });
  saveData();
  const refDate = new Date(destination + 'T12:00:00');
  currentYear = refDate.getFullYear();
  currentMonth = refDate.getMonth();
  window.pendingShiftDestination = null;
  window.pendingShiftId = null;
  closeMoveCopyMenu();
  renderCurrentView();
}

/* Render Calendar Function */
function renderCalendar() {
  autoUpdatePastPlannedShifts();
  const daysContainer = document.getElementById('calendar-days');
  daysContainer.innerHTML = '';

  let rawFirstDay = new Date(currentYear, currentMonth, 1).getDay();
  let firstDay = (rawFirstDay === 0) ? 6 : rawFirstDay - 1;
  const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
  const prevLastDay = new Date(currentYear, currentMonth, 0).getDate();
  const today = new Date();

  let mPayCompleted = 0;
  let mPayTotal = 0;

  const createCellContent = (dayNum, dateStr, dateObj, isCurrentMonth) => {
    const holidayInfo = getHolidayInfo(dateStr, dateObj);
    let html = `<span class="day-number">${dayNum}</span>`;

    if (holidayInfo.isHoliday && holidayInfo.label) {
      html += `<div class="holiday-label">${holidayInfo.label}</div>`;
    }

    const dayShifts = shifts.filter(s => s.date === dateStr);
    let shiftsHtml = '';

    dayShifts.forEach(s => {
      const pay = getShiftPay(s);
      if (isCurrentMonth) {
        mPayTotal += pay;
        if (s.type === 'completed' || !s.type) {
          mPayCompleted += pay;
        }
      }

      const isPlanned = s.type === 'planned';
      const timeTag = `${formatShortTime(s.startTime)}-${formatShortTime(s.endTime)}`;

      shiftsHtml += `
      <div class="shift-dot-item ${isPlanned ? 'planned' : ''}" 
           data-id="${s.id}"
           onpointerdown="startShiftLongPress(event, '${s.id}')" 
           onpointercancel="cancelShiftLongPress()"
           onpointerleave="cancelShiftLongPress()"
           title="${s.company} (${timeTag}) $${pay}">
        <div class="comp-name">${s.company}</div>
        <div class="shift-time">${timeTag}</div>
        <div class="shift-money">$${formatMoney(pay)}</div>
      </div>
      `;
    });

    html += `<div class="shift-items-wrap">${shiftsHtml}</div>`;
    return html;
  };

  // 1. 上個月 Preview
  for (let i = firstDay - 1; i >= 0; i--) {
    const cell = document.createElement('div');
    cell.className = 'day-cell other-month';
    const prevDate = new Date(currentYear, currentMonth, -(i));
    const prevDateStr = getLocalDateStr(prevDate);
    cell.dataset.date = prevDateStr;
    cell.onclick = (e) => {
      if (Date.now() < suppressClickUntil) return;
      openModal(prevDateStr);
    };
    cell.innerHTML = createCellContent(prevLastDay - i, prevDateStr, prevDate, false);
    daysContainer.appendChild(cell);
  }

  // 2. 本月日子
  for (let day = 1; day <= totalDays; day++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const dateObj = new Date(currentYear, currentMonth, day);
    cell.dataset.date = dateStr;
    cell.onclick = (e) => {
      if (Date.now() < suppressClickUntil) return;
      openModal(dateStr);
    };

    if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
      cell.classList.add('today');
    }
    if (getHolidayInfo(dateStr, dateObj).isHoliday) {
      cell.classList.add('is-holiday');
    }

    cell.innerHTML = createCellContent(day, dateStr, dateObj, true);
    daysContainer.appendChild(cell);
  }

  // 3. 下個月 Preview
  const totalRendered = firstDay + totalDays;
  const nextDays = (7 - (totalRendered % 7)) % 7;
  for (let i = 1; i <= nextDays; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell other-month';
    const nextDate = new Date(currentYear, currentMonth + 1, i);
    const nextDateStr = getLocalDateStr(nextDate);
    cell.dataset.date = nextDateStr;
    cell.onclick = (e) => {
      if (Date.now() < suppressClickUntil) return;
      openModal(nextDateStr);
    };
    cell.innerHTML = createCellContent(i, nextDateStr, nextDate, false);
    daysContainer.appendChild(cell);
  }

  document.querySelectorAll('.shift-dot-item').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (Date.now() >= suppressClickUntil && el.dataset.id) {
        openShiftDetail(el.dataset.id);
      }
    });
  });

  updateMonthSalaryCard();
}

  document.getElementById('mini-cal-next').addEventListener('click', () => {
    miniCalMonth++;
    if (miniCalMonth > 11) { miniCalMonth = 0; miniCalYear++; }
    renderMiniCalendar();
  });


  shiftForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const editingId = document.getElementById('editing-shift-id').value;
    const duration = getCalculatedDuration();
    const isDeduct = document.getElementById('no-lunch-check').checked;
    const deductMins = isDeduct ? (parseFloat(document.getElementById('deduct-minutes').value) || 0) : 0;
    let type = document.getElementById('shift-type').value;
    const company = document.getElementById('company').value.trim();
    const eventName = document.getElementById('event-name').value.trim() || "-";
    const rate = parseFloat(document.getElementById('rate').value);
    const allowance = parseFloat(document.getElementById('allowance').value) || 0;
    const startTime = document.getElementById('start-time').value;
    const endTime = document.getElementById('end-time').value;
    const now = new Date();
    const todayStr = getLocalDateStr(now);

    if (editingId) {
      const targetIndex = shifts.findIndex(s => s.id == editingId);
      if (targetIndex !== -1) {
        let finalType = type;
        if (finalType === 'planned') {
          if (modalRangeStart < todayStr) {
            finalType = 'completed';
          } else if (modalRangeStart === todayStr) {
            const [eH, eM] = endTime.split(':').map(Number);
            const endDt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), eH, eM);
            if (now >= endDt) finalType = 'completed';
          }
        }
        shifts[targetIndex] = {
          id: editingId,
          type: finalType,
          date: modalRangeStart,
          company: company,
          eventName: eventName,
          rate: rate,
          allowance: allowance,
          startTime: startTime,
          endTime: endTime,
          deductMins: deductMins,
          duration: duration
        };
      }
    } else {
      if (selectedDatesList.length === 0) {
        alert('請選擇日期');
        return;
      }
      selectedDatesList.forEach((dateStr, index) => {
        let finalType = type;
        if (finalType === 'planned') {
          if (dateStr < todayStr) {
            finalType = 'completed';
          } else if (dateStr === todayStr) {
            const [eH, eM] = endTime.split(':').map(Number);
            const endDt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), eH, eM);
            if (now >= endDt) finalType = 'completed';
          }
        }
        const newShift = {
          id: Date.now() + index,
          type: finalType,
          date: dateStr,
          company: company,
          eventName: eventName,
          rate: rate,
          allowance: allowance,
          startTime: startTime,
          endTime: endTime,
          deductMins: deductMins,
          duration: duration
        };
        shifts.push(newShift);
      });
    }
    saveData();
    const refDate = new Date(modalRangeStart);
    currentYear = refDate.getFullYear();
    currentMonth = refDate.getMonth();
    renderCurrentView();
    closeModal();
    document.getElementById('event-name').value = '';
  });

  // 全域 Pointer 移動與放開監聽
  document.addEventListener('pointermove', event => {
    if (!dragShiftId || !longPressTriggered) return;
    
    if (event.cancelable) event.preventDefault();

    const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.day-cell[data-date]');
    clearDropTarget();
    if (target) {
      target.classList.add('drop-target');
      dragDestination = target.dataset.date;
    }
  }, { passive: false });

  document.addEventListener('pointerup', () => {
    if (dragShiftId && longPressTriggered) {
      finishShiftDrag();
    } else {
      cancelShiftLongPress();
    }
  });

  (function setupCalendarSwipe() {
    const calendar = document.getElementById('calendar-days');
    if (!calendar || calendar.dataset.swipeReady) return;
    calendar.dataset.swipeReady = '1';
    let startX = 0;
    let startY = 0;
    calendar.addEventListener('touchstart', event => {
      if (event.touches.length !== 1 || dragShiftId) return;
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
    }, { passive: true });
    calendar.addEventListener('touchend', event => {
      if (!startX || !startY || event.changedTouches.length !== 1 || dragShiftId) return;
      const dx = event.changedTouches[0].clientX - startX;
      const dy = event.changedTouches[0].clientY - startY;
      startX = 0;
      startY = 0;
      if (Math.abs(dx) < 60 || Math.abs(dx) <= Math.abs(dy) * 1.2) return;
      changeMonth(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();

  /* [CHANGE U] keep --ts-h = height of the fixed top block so the budget card can stick right under it */
  const tsEl = document.getElementById('top-sticky');
  const setTs = () => document.documentElement.style.setProperty('--ts-h', tsEl.offsetHeight + 'px');
  setTs();
  if (window.ResizeObserver) new ResizeObserver(setTs).observe(tsEl);
  window.addEventListener('resize', setTs);

  /* [CHANGE R] swipe left/right to change month on budget / analysis / report pages too */
  ['list-view', 'analysis-view', 'overall-view', 'analytics-view'].forEach(id => {
    const el = document.getElementById(id);
    if (!el || el.dataset.swipeReady) return;
    el.dataset.swipeReady = '1';
    let sx = 0, sy = 0;
    el.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener('touchend', e => {
      if (!sx || e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      sx = 0; sy = 0;
      if (Math.abs(dx) < 60 || Math.abs(dx) <= Math.abs(dy) * 1.2) return;
      changeMonth(dx < 0 ? 1 : -1);
    }, { passive: true });
  });
});
</script>
</body>
</html>
